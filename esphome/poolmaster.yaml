# ==============================================================================
# PoolMaster — Portage ESPHome
# ==============================================================================
# Réécriture ESPHome du firmware ESP32-PoolMaster (PlatformIO/Arduino).
# Matériel identique : carte PoolMaster (ESP32 DevKit v1), ADS1115 (pH/ORP/PSI),
# 2 bus OneWire DS18B20 (eau/air), PCF8574 (8 LEDs de statut), 8 relais,
# 3 contacts de niveau (bac pH, bac Chlore, niveau piscine), buzzer.
#
# Fonctions portées :
#   - Mesures pH / ORP / Pression avec calibration linéaire (C0, C1)
#   - Températures eau et air (DS18B20)
#   - Régulation pH et ORP par PID fenêtré (dosage proportionnel, identique
#     au principe "PWM lent" du firmware d'origine ; pH en sens REVERSE,
#     ORP en sens DIRECT)
#   - Automatisation de la filtration : durée calculée à 15h selon la
#     température de l'eau (2h / T°/3 / T°/2), fenêtre centrée sur 15h,
#     bornée par heure-min / heure-max
#   - Mode hiver + protection antigel (marche forcée si T° air < -2°C,
#     arrêt autorisé au-dessus de +2°C)
#   - Électrolyseur au sel (SWG) : mode régulé par l'ORP, avec température
#     minimale de fonctionnement et délai après démarrage filtration
#   - Robot : démarrage différé après la filtration, durée limitée, 1x/jour
#   - Sécurités : surpression (PSI), temps de marche max quotidien des pompes
#     doseuses, niveaux de bacs, verrouillage doseuses/SWG sur la filtration
#   - Estimation du remplissage des bacs (débit pompe × temps de marche)
#   - 8 LEDs de statut sur PCF8574 + buzzer d'alarme
#
# Non porté (voir esphome/README.md) : écran Nextion (interface via Home
# Assistant), API MQTT JSON historique (remplacée par l'API native ESPHome —
# un bloc MQTT optionnel est fourni en commentaire), notifications SMTP
# (à faire côté Home Assistant).
# ==============================================================================

substitutions:
  name: poolmaster
  friendly_name: PoolMaster

  # --- Brochage (identique à include/Config.h) ---
  pin_filtration: GPIO32   # Pompe de filtration
  pin_robot: GPIO33        # Pompe robot
  pin_ph_pump: GPIO25      # Pompe péristaltique pH (acide)
  pin_chl_pump: GPIO26     # Pompe péristaltique Chlore
  pin_relay_r0: GPIO27     # Relais libre R0 (projecteur)
  pin_relay_r1: GPIO4      # Relais libre R1
  pin_swg: GPIO13          # Électrolyseur au sel (SWG)
  pin_fill_pump: GPIO23    # Pompe de remplissage
  pin_buzzer: GPIO2        # Buzzer
  pin_chl_level: GPIO39    # Contact niveau bac Chlore (ouvert = niveau bas)
  pin_ph_level: GPIO36     # Contact niveau bac pH (ouvert = niveau bas)
  pin_pool_level: GPIO34   # Contact niveau piscine (ouvert = niveau bas)
  pin_ow_air: GPIO18       # Bus OneWire température air
  pin_ow_water: GPIO19     # Bus OneWire température eau
  pin_sda: GPIO21
  pin_scl: GPIO22

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Gestion automatique de piscine (portage ESPHome de ESP32-PoolMaster)"
  project:
    name: "ekozan.esp32-poolmaster"
    version: "ESPHome-1.0"

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Point d'accès de secours si le WiFi est indisponible
  ap:
    ssid: "PoolMaster Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80

# --- MQTT optionnel -----------------------------------------------------------
# L'intégration Home Assistant passe par l'API native ESPHome (recommandé).
# Décommentez ce bloc pour publier aussi vers un broker MQTT (Jeedom, NodeRed,
# InfluxDB…). Les topics suivent la convention ESPHome (<name>/sensor/...),
# pas l'API JSON historique Home/Pool/.
# mqtt:
#   broker: !secret mqtt_broker
#   username: !secret mqtt_username
#   password: !secret mqtt_password
#   discovery: false

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Paris
    on_time:
      # Tick planificateur : filtration auto, antigel, activation des PID, robot
      - seconds: 0
        minutes: '*'
        then:
          - script.execute: scheduler_tick
      # Calcul quotidien de la plage de filtration à 15h05 (l'eau a circulé,
      # la température est représentative — cf. firmware d'origine à 15h)
      - seconds: 0
        minutes: 5
        hours: 15
        then:
          - script.execute: compute_filtration_schedule
      # Remise à zéro quotidienne des compteurs de marche des pompes doseuses
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              id(ph_uptime_s) = 0;
              id(chl_uptime_s) = 0;
              id(fill_uptime_s) = 0;
              id(robot_done) = false;

# ==============================================================================
# Bus
# ==============================================================================
i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}
  scan: true

ads1115:
  - address: 0x48
    id: ads1

pcf8574:
  - id: pcf_leds
    address: 0x20
    pcf8575: false

one_wire:
  - platform: gpio
    pin: ${pin_ow_water}
    id: ow_water
  - platform: gpio
    pin: ${pin_ow_air}
    id: ow_air

# ==============================================================================
# Variables globales (état de la régulation)
# ==============================================================================
globals:
  # Fenêtres PID (millis() de début de fenêtre + dose calculée en ms)
  - id: ph_win_start
    type: uint32_t
    initial_value: '0'
  - id: ph_out_ms
    type: float
    initial_value: '0'
  - id: ph_integ
    type: float
    initial_value: '0'
  - id: ph_last_err
    type: float
    initial_value: '0'
  - id: orp_win_start
    type: uint32_t
    initial_value: '0'
  - id: orp_out_ms
    type: float
    initial_value: '0'
  - id: orp_integ
    type: float
    initial_value: '0'
  - id: orp_last_err
    type: float
    initial_value: '0'

  # Compteurs de marche quotidiens (secondes)
  - id: ph_uptime_s
    type: int
    restore_value: true
    initial_value: '0'
  - id: chl_uptime_s
    type: int
    restore_value: true
    initial_value: '0'
  - id: fill_uptime_s
    type: int
    restore_value: true
    initial_value: '0'

  # Volume consommé dans les bacs (litres), remis à zéro au remplissage
  - id: ph_used_l
    type: float
    restore_value: true
    initial_value: '0'
  - id: chl_used_l
    type: float
    restore_value: true
    initial_value: '0'

  # Drapeaux d'erreur (effacés par le bouton "Acquitter les erreurs")
  - id: psi_error
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ph_uptime_error
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: chl_uptime_error
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: fill_uptime_error
    type: bool
    restore_value: false
    initial_value: 'false'

  # Plage de filtration calculée (heures entières)
  - id: filt_start_h
    type: int
    restore_value: true
    initial_value: '8'
  - id: filt_stop_h
    type: int
    restore_value: true
    initial_value: '13'
  - id: filt_duration_h
    type: int
    restore_value: true
    initial_value: '5'

  # Divers
  - id: antifreeze_on
    type: bool
    initial_value: 'false'
  - id: filt_started_ms
    type: uint32_t
    initial_value: '0'
  - id: robot_started_ms
    type: uint32_t
    initial_value: '0'
  - id: robot_done
    type: bool
    initial_value: 'false'

# ==============================================================================
# Capteurs
# ==============================================================================
sensor:
  # --- Tensions brutes ADS1115 (A0 = ORP, A1 = pH, A2 = PSI, gain 6.144 V) ---
  - platform: ads1115
    ads1115_id: ads1
    multiplexer: 'A0_GND'
    gain: 6.144
    id: orp_volts
    internal: true
    update_interval: 1s
    filters:
      - median:
          window_size: 11
          send_every: 1
          send_first_at: 1
  - platform: ads1115
    ads1115_id: ads1
    multiplexer: 'A1_GND'
    gain: 6.144
    id: ph_volts
    internal: true
    update_interval: 1s
    filters:
      - median:
          window_size: 11
          send_every: 1
          send_first_at: 1
  - platform: ads1115
    ads1115_id: ads1
    multiplexer: 'A2_GND'
    gain: 6.144
    id: psi_volts
    internal: true
    update_interval: 1s
    filters:
      - median:
          window_size: 11
          send_every: 1
          send_first_at: 1

  # --- Valeurs calibrées : valeur = tension(V) * C0 + C1 (comme l'origine) ---
  - platform: template
    name: "pH"
    id: ph_val
    icon: mdi:ph
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 2s
    lambda: |-
      if (!id(ph_volts).has_state()) return {};
      return id(ph_volts).state * id(num_ph_c0).state + id(num_ph_c1).state;
  - platform: template
    name: "ORP"
    id: orp_val
    unit_of_measurement: "mV"
    icon: mdi:flash
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 2s
    lambda: |-
      if (!id(orp_volts).has_state()) return {};
      return id(orp_volts).state * id(num_orp_c0).state + id(num_orp_c1).state;
  - platform: template
    name: "Pression filtration"
    id: psi_val
    unit_of_measurement: "bar"
    device_class: pressure
    icon: mdi:gauge
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 2s
    lambda: |-
      if (!id(psi_volts).has_state()) return {};
      float v = id(psi_volts).state * id(num_psi_c0).state + id(num_psi_c1).state;
      return v < 0 ? 0.0f : v;

  # --- Températures DS18B20 ---
  # Un seul capteur par bus : l'adresse n'est pas nécessaire. Si vous en avez
  # plusieurs, ajoutez `address: 0x...` (les adresses d'origine sont dans
  # src/Loops.cpp).
  - platform: dallas_temp
    one_wire_id: ow_water
    name: "Température eau"
    id: water_temp
    resolution: 12
    update_interval: 10s
    filters:
      - filter_out: nan
  - platform: dallas_temp
    one_wire_id: ow_air
    name: "Température air"
    id: air_temp
    resolution: 12
    update_interval: 10s
    filters:
      - filter_out: nan

  # --- Compteurs et estimations ---
  - platform: template
    name: "Marche pompe pH aujourd'hui"
    unit_of_measurement: "min"
    icon: mdi:timer
    accuracy_decimals: 1
    update_interval: 30s
    lambda: 'return id(ph_uptime_s) / 60.0f;'
  - platform: template
    name: "Marche pompe Chlore aujourd'hui"
    unit_of_measurement: "min"
    icon: mdi:timer
    accuracy_decimals: 1
    update_interval: 30s
    lambda: 'return id(chl_uptime_s) / 60.0f;'
  - platform: template
    name: "Niveau bac pH"
    unit_of_measurement: "%"
    icon: mdi:car-coolant-level
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      float pct = 100.0f * (1.0f - id(ph_used_l) / id(num_ph_tank_vol).state);
      return pct < 0 ? 0.0f : pct;
  - platform: template
    name: "Niveau bac Chlore"
    unit_of_measurement: "%"
    icon: mdi:car-coolant-level
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      float pct = 100.0f * (1.0f - id(chl_used_l) / id(num_chl_tank_vol).state);
      return pct < 0 ? 0.0f : pct;
  - platform: template
    name: "Filtration début"
    unit_of_measurement: "h"
    icon: mdi:clock-start
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(filt_start_h);'
  - platform: template
    name: "Filtration fin"
    unit_of_measurement: "h"
    icon: mdi:clock-end
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(filt_stop_h);'
  - platform: template
    name: "Filtration durée"
    unit_of_measurement: "h"
    icon: mdi:timelapse
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(filt_duration_h);'
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic

# ==============================================================================
# Entrées binaires (contacts de niveau : contact ouvert = niveau bas)
# ==============================================================================
binary_sensor:
  - platform: gpio
    pin:
      number: ${pin_ph_level}
      mode: INPUT
    name: "Bac pH niveau bas"
    id: ph_tank_low
    device_class: problem
    filters:
      - delayed_on: 2s
      - delayed_off: 2s
  - platform: gpio
    pin:
      number: ${pin_chl_level}
      mode: INPUT
    name: "Bac Chlore niveau bas"
    id: chl_tank_low
    device_class: problem
    filters:
      - delayed_on: 2s
      - delayed_off: 2s
  - platform: gpio
    pin:
      number: ${pin_pool_level}
      mode: INPUT
    name: "Niveau piscine bas"
    id: pool_level_low
    device_class: problem
    filters:
      - delayed_on: 5s
      - delayed_off: 5s

  # --- Drapeaux d'erreur exposés ---
  - platform: template
    name: "Erreur surpression"
    device_class: problem
    lambda: 'return id(psi_error);'
  - platform: template
    name: "Erreur temps de marche pompe pH"
    device_class: problem
    lambda: 'return id(ph_uptime_error);'
  - platform: template
    name: "Erreur temps de marche pompe Chlore"
    device_class: problem
    lambda: 'return id(chl_uptime_error);'
  - platform: template
    name: "Antigel actif"
    icon: mdi:snowflake-alert
    lambda: 'return id(antifreeze_on);'

# ==============================================================================
# Sorties relais
# ==============================================================================
switch:
  - platform: gpio
    pin: ${pin_filtration}
    name: "Pompe filtration"
    id: filtration_pump
    icon: mdi:pump
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: 'id(filt_started_ms) = millis();'
  - platform: gpio
    pin: ${pin_ph_pump}
    name: "Pompe pH"
    id: ph_pump
    icon: mdi:pump
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: ${pin_chl_pump}
    name: "Pompe Chlore"
    id: chl_pump
    icon: mdi:pump
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: ${pin_robot}
    name: "Robot"
    id: robot_pump
    icon: mdi:robot-vacuum
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: ${pin_swg}
    name: "Électrolyseur"
    id: swg_pump
    icon: mdi:water-plus
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: ${pin_fill_pump}
    name: "Pompe remplissage"
    id: fill_pump
    icon: mdi:water-pump
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: ${pin_relay_r0}
    name: "Relais R0 (projecteur)"
    id: relay_r0
    icon: mdi:lightbulb
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    pin: ${pin_relay_r1}
    name: "Relais R1"
    id: relay_r1
    icon: mdi:electric-switch
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    pin: ${pin_buzzer}
    id: buzzer_out
    internal: true
    restore_mode: ALWAYS_OFF

  # --- Modes de fonctionnement (équivalents des commandes MQTT d'origine) ---
  - platform: template
    name: "Mode automatique"
    id: sw_auto_mode
    icon: mdi:refresh-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    name: "Mode hiver"
    id: sw_winter_mode
    icon: mdi:snowflake
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    name: "Régulation pH auto"
    id: sw_ph_auto
    icon: mdi:ph
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    name: "Régulation ORP auto"
    id: sw_orp_auto
    icon: mdi:flash-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    name: "Mode électrolyseur"
    id: sw_electrolyse_mode
    icon: mdi:water-plus
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    name: "Buzzer activé"
    id: sw_buzzer_enabled
    icon: mdi:volume-high
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  # --- Boucles PID (activables à la main, ou pilotées par les modes auto) ---
  - platform: template
    name: "PID pH"
    id: sw_ph_pid
    icon: mdi:chart-bell-curve
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          // Nouvelle fenêtre de dosage, erreurs pompes acquittées (comme SetPhPID)
          id(ph_win_start) = millis();
          id(ph_out_ms) = 0;
          id(ph_integ) = 0;
          id(ph_last_err) = 0;
    on_turn_off:
      - switch.turn_off: ph_pump
  - platform: template
    name: "PID ORP"
    id: sw_orp_pid
    icon: mdi:chart-bell-curve
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          id(orp_win_start) = millis();
          id(orp_out_ms) = 0;
          id(orp_integ) = 0;
          id(orp_last_err) = 0;
    on_turn_off:
      - switch.turn_off: chl_pump

# ==============================================================================
# Réglages (équivalents des paramètres NVS / commandes MQTT d'origine)
# ==============================================================================
number:
  # --- Consignes ---
  - platform: template
    name: "Consigne pH"
    id: num_ph_setpoint
    icon: mdi:ph
    min_value: 6.5
    max_value: 8.5
    step: 0.01
    initial_value: 7.2
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Consigne ORP"
    id: num_orp_setpoint
    unit_of_measurement: "mV"
    icon: mdi:flash
    min_value: 400
    max_value: 900
    step: 1
    initial_value: 750
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Consigne température eau"
    id: num_water_setpoint
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    min_value: 15
    max_value: 35
    step: 0.5
    initial_value: 27
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Seuil température eau basse"
    id: num_water_low
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low
    min_value: 0
    max_value: 20
    step: 0.5
    initial_value: 10
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Seuil surpression"
    id: num_psi_high
    unit_of_measurement: "bar"
    icon: mdi:gauge-full
    min_value: 0.1
    max_value: 5
    step: 0.05
    initial_value: 1.0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

  # --- PID pH (mêmes unités que l'origine : Kp en ms de pompe / unité pH) ---
  - platform: template
    name: "pH Kp"
    id: num_ph_kp
    min_value: 0
    max_value: 10000000
    step: 10000
    initial_value: 2700000
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "pH Ki"
    id: num_ph_ki
    min_value: 0
    max_value: 1000
    step: 0.001
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "pH Kd"
    id: num_ph_kd
    min_value: 0
    max_value: 1000000000
    step: 1000
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Fenêtre PID pH"
    id: num_ph_window
    unit_of_measurement: "min"
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 60
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

  # --- PID ORP ---
  - platform: template
    name: "ORP Kp"
    id: num_orp_kp
    min_value: 0
    max_value: 100000
    step: 100
    initial_value: 2500
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "ORP Ki"
    id: num_orp_ki
    min_value: 0
    max_value: 1000
    step: 0.001
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "ORP Kd"
    id: num_orp_kd
    min_value: 0
    max_value: 1000000000
    step: 1000
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Fenêtre PID ORP"
    id: num_orp_window
    unit_of_measurement: "min"
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

  # --- Filtration ---
  - platform: template
    name: "Filtration heure min"
    id: num_filt_start_min
    unit_of_measurement: "h"
    icon: mdi:clock-start
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Filtration heure max"
    id: num_filt_stop_max
    unit_of_measurement: "h"
    icon: mdi:clock-end
    min_value: 1
    max_value: 24
    step: 1
    initial_value: 22
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
