# ==============================================================================
# Boucles périodiques
# ==============================================================================
interval:
  # ----------------------------------------------------------------------------
  # Boucle de régulation 1 s : équivalent des tâches pHRegulation/OrpRegulation
  # + sécurités (surpression, temps de marche, niveaux de bacs, verrouillages)
  # ----------------------------------------------------------------------------
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool filt_on = id(filtration_pump).state;

          // ------------------------------------------------------------------
          // Sécurité surpression : filtration en marche depuis > 2 min et
          // pression au-dessus du seuil -> erreur, tout s'arrête.
          // ------------------------------------------------------------------
          if (filt_on && (now - id(filt_started_ms)) > 120000 &&
              id(psi_val).has_state() &&
              id(psi_val).state > id(num_psi_high).state) {
            if (!id(psi_error))
              ESP_LOGE("poolmaster", "SURPRESSION: %.2f bar > %.2f bar",
                       id(psi_val).state, id(num_psi_high).state);
            id(psi_error) = true;
          }
          if (id(psi_error) && filt_on) id(filtration_pump).turn_off();

          // ------------------------------------------------------------------
          // Comptage temps de marche + consommation bacs + plafond quotidien
          // ------------------------------------------------------------------
          const int max_up_s = (int)(id(num_max_uptime).state * 60);
          if (id(ph_pump).state) {
            id(ph_uptime_s) += 1;
            id(ph_used_l) += id(num_ph_flow).state / 3600.0f;
            if (id(ph_uptime_s) > max_up_s && !id(ph_uptime_error)) {
              id(ph_uptime_error) = true;
              ESP_LOGE("poolmaster", "Pompe pH: temps de marche quotidien depasse");
            }
          }
          if (id(chl_pump).state) {
            id(chl_uptime_s) += 1;
            id(chl_used_l) += id(num_chl_flow).state / 3600.0f;
            if (id(chl_uptime_s) > max_up_s && !id(chl_uptime_error)) {
              id(chl_uptime_error) = true;
              ESP_LOGE("poolmaster", "Pompe Chlore: temps de marche quotidien depasse");
            }
          }
          if (id(fill_pump).state) {
            id(fill_uptime_s) += 1;
            if (id(fill_uptime_s) > max_up_s && !id(fill_uptime_error)) {
              id(fill_uptime_error) = true;
              ESP_LOGE("poolmaster", "Pompe remplissage: temps de marche quotidien depasse");
              id(fill_pump).turn_off();
            }
          }

          // ------------------------------------------------------------------
          // Conditions de blocage des pompes doseuses (verrouillage filtration,
          // bac vide, erreur temps de marche, surpression)
          // ------------------------------------------------------------------
          const bool ph_blocked  = !filt_on || id(psi_error) ||
                                   id(ph_uptime_error) || id(ph_tank_low).state;
          const bool chl_blocked = !filt_on || id(psi_error) ||
                                   id(chl_uptime_error) || id(chl_tank_low).state;

          // ------------------------------------------------------------------
          // Régulation pH — PID fenêtré, sens REVERSE (l'acide fait baisser
          // le pH) : calcul de la dose au début de chaque fenêtre, la pompe
          // tourne pendant "dose" ms en début de fenêtre (cf. README d'origine)
          // ------------------------------------------------------------------
          if (id(sw_ph_pid).state && !ph_blocked && id(ph_val).has_state()) {
            const float win_ms = id(num_ph_window).state * 60000.0f;
            if ((now - id(ph_win_start)) >= (uint32_t) win_ms) {
              id(ph_win_start) = now;
              const float err = id(ph_val).state - id(num_ph_setpoint).state; // REVERSE
              id(ph_integ) += err * win_ms;
              float deriv = (err - id(ph_last_err)) / win_ms;
              id(ph_last_err) = err;
              float out = id(num_ph_kp).state * err
                        + id(num_ph_ki).state * id(ph_integ)
                        + id(num_ph_kd).state * deriv;
              if (out <= 0) { out = 0; id(ph_integ) = 0; }    // anti-windup
              if (out > win_ms) { out = win_ms; id(ph_integ) = 0; }
              if (out < 30000) out = 0;   // dose < 30 s : pas significative
              id(ph_out_ms) = out;
              ESP_LOGI("poolmaster", "PID pH: mesure=%.2f consigne=%.2f dose=%.0f ms",
                       id(ph_val).state, id(num_ph_setpoint).state, out);
            }
            const bool dose = (now - id(ph_win_start)) < (uint32_t) id(ph_out_ms);
            if (dose && !id(ph_pump).state) id(ph_pump).turn_on();
            if (!dose && id(ph_pump).state) id(ph_pump).turn_off();
          } else if (ph_blocked && id(ph_pump).state) {
            id(ph_pump).turn_off();
          }

          // ------------------------------------------------------------------
          // Régulation ORP — PID fenêtré, sens DIRECT (le chlore fait monter
          // l'ORP). Inactif si le mode électrolyseur est choisi.
          // ------------------------------------------------------------------
          if (id(sw_orp_pid).state && !id(sw_electrolyse_mode).state &&
              !chl_blocked && id(orp_val).has_state()) {
            const float win_ms = id(num_orp_window).state * 60000.0f;
            if ((now - id(orp_win_start)) >= (uint32_t) win_ms) {
              id(orp_win_start) = now;
              const float err = id(num_orp_setpoint).state - id(orp_val).state; // DIRECT
              id(orp_integ) += err * win_ms;
              float deriv = (err - id(orp_last_err)) / win_ms;
              id(orp_last_err) = err;
              float out = id(num_orp_kp).state * err
                        + id(num_orp_ki).state * id(orp_integ)
                        + id(num_orp_kd).state * deriv;
              if (out <= 0) { out = 0; id(orp_integ) = 0; }
              if (out > win_ms) { out = win_ms; id(orp_integ) = 0; }
              if (out < 30000) out = 0;
              id(orp_out_ms) = out;
              ESP_LOGI("poolmaster", "PID ORP: mesure=%.0f consigne=%.0f dose=%.0f ms",
                       id(orp_val).state, id(num_orp_setpoint).state, out);
            }
            const bool dose = (now - id(orp_win_start)) < (uint32_t) id(orp_out_ms);
            if (dose && !id(chl_pump).state) id(chl_pump).turn_on();
            if (!dose && id(chl_pump).state) id(chl_pump).turn_off();
          } else if (chl_blocked && id(chl_pump).state) {
            id(chl_pump).turn_off();
          }

          // ------------------------------------------------------------------
          // Électrolyseur (mode régulé) : marche si filtration en route depuis
          // plus du délai configuré, eau assez chaude et ORP sous la consigne.
          // ------------------------------------------------------------------
          if (id(sw_electrolyse_mode).state && id(sw_orp_auto).state) {
            bool want = filt_on && !id(psi_error) &&
                        id(water_temp).has_state() &&
                        id(water_temp).state >= id(num_swg_temp).state &&
                        (now - id(filt_started_ms)) >
                            (uint32_t)(id(num_swg_delay).state * 60000.0f) &&
                        id(orp_val).has_state() &&
                        id(orp_val).state < id(num_orp_setpoint).state;
            if (want && !id(swg_pump).state) id(swg_pump).turn_on();
            if (!want && id(swg_pump).state) id(swg_pump).turn_off();
          } else if (!filt_on && id(swg_pump).state) {
            // Verrouillage : jamais d'électrolyse sans circulation d'eau
            id(swg_pump).turn_off();
          }

          // ------------------------------------------------------------------
          // Robot : en mode auto, démarre "délai" min après la filtration,
          // tourne "durée" min, une fois par jour, et jamais sans filtration.
          // ------------------------------------------------------------------
          if (id(sw_auto_mode).state && filt_on && !id(robot_done)) {
            const uint32_t delay_ms = (uint32_t)(id(num_robot_delay).state * 60000.0f);
            const uint32_t dur_ms   = (uint32_t)(id(num_robot_duration).state * 60000.0f);
            if (!id(robot_pump).state &&
                (now - id(filt_started_ms)) >= delay_ms) {
              id(robot_pump).turn_on();
              id(robot_started_ms) = now;
            } else if (id(robot_pump).state &&
                       (now - id(robot_started_ms)) >= dur_ms) {
              id(robot_pump).turn_off();
              id(robot_done) = true;
            }
          }
          if (!filt_on && id(robot_pump).state) id(robot_pump).turn_off();

  # ----------------------------------------------------------------------------
  # LEDs de statut + buzzer, toutes les 3 s (équivalent tâche StatusLights)
  # ----------------------------------------------------------------------------
  - interval: 3s
    then:
      - lambda: |-
          const bool net_ok = wifi::global_wifi_component->is_connected();
          const bool tank_low = id(ph_tank_low).state || id(chl_tank_low).state;
          const bool any_err = id(psi_error) || id(ph_uptime_error) ||
                               id(chl_uptime_error) || id(fill_uptime_error);

          auto set_led = [](output::BinaryOutput *o, bool on) {
            if (on) o->turn_on(); else o->turn_off();
          };
          set_led(id(led_wifi),       net_ok);
          set_led(id(led_filtration), id(filtration_pump).state);
          set_led(id(led_auto),       id(sw_auto_mode).state);
          set_led(id(led_ph),         id(sw_ph_pid).state);
          set_led(id(led_orp),        id(sw_orp_pid).state || id(swg_pump).state);
          set_led(id(led_tank),       tank_low);
          set_led(id(led_error),      any_err);
          set_led(id(led_winter),     id(sw_winter_mode).state);

          // Buzzer : alarme sonore si activé et défaut présent
          const bool alarm = id(sw_buzzer_enabled).state && (tank_low || any_err);
          if (alarm && !id(buzzer_out).state) id(buzzer_out).turn_on();
          if (!alarm && id(buzzer_out).state) id(buzzer_out).turn_off();

# ==============================================================================
# Scripts
# ==============================================================================
script:
  # ----------------------------------------------------------------------------
  # Tick planificateur (toutes les minutes) : filtration auto, antigel,
  # activation/désactivation automatique des boucles PID.
  # ----------------------------------------------------------------------------
  - id: scheduler_tick
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          if (!t.is_valid()) return;
          const int h = t.hour;
          const int mins = t.hour * 60 + t.minute;
          const bool auto_mode = id(sw_auto_mode).state;
          const bool winter = id(sw_winter_mode).state;

          // --- Antigel : en mode hiver, marche forcée sous -2°C ; on ne
          //     relâche qu'au-dessus de +2°C (hystérésis de l'origine) ---
          if (id(air_temp).has_state()) {
            if (winter && id(air_temp).state < -2.0f) id(antifreeze_on) = true;
            if (id(air_temp).state > 2.0f) id(antifreeze_on) = false;
          }

          // --- Filtration automatique ---
          if (!id(psi_error)) {
            const bool in_window = h >= id(filt_start_h) && h < id(filt_stop_h);
            const bool want = (auto_mode && in_window) || id(antifreeze_on);
            if (auto_mode || id(antifreeze_on)) {
              if (want && !id(filtration_pump).state) {
                ESP_LOGI("poolmaster", "Filtration: demarrage auto (%dh-%dh)",
                         id(filt_start_h), id(filt_stop_h));
                id(filtration_pump).turn_on();
              }
              // Jamais d'arrêt automatique si l'air est <= 2°C (protection gel)
              const bool freeze_hold = id(air_temp).has_state() &&
                                       id(air_temp).state <= 2.0f;
              if (!want && id(filtration_pump).state && !freeze_hold) {
                ESP_LOGI("poolmaster", "Filtration: arret auto");
                id(filtration_pump).turn_off();
              }
            }
          }

          // --- Activation automatique des régulations ---
          // Fenêtre de régulation : [début filtration + délai PID ; fin filtration[
          // Conditions : pas de mode hiver, eau au-dessus du seuil bas.
          const bool in_reg_window =
              mins >= id(filt_start_h) * 60 + (int) id(num_delay_pid).state &&
              h < id(filt_stop_h);
          const bool water_ok = id(water_temp).has_state() &&
                                id(water_temp).state >= id(num_water_low).state;
          const bool reg_ok = !winter && water_ok && id(filtration_pump).state &&
                              in_reg_window && !id(psi_error);

          if (id(sw_ph_auto).state) {
            const bool want_ph = reg_ok && !id(ph_uptime_error) &&
                                 !id(ph_tank_low).state;
            if (want_ph && !id(sw_ph_pid).state) id(sw_ph_pid).turn_on();
            if (!want_ph && id(sw_ph_pid).state) id(sw_ph_pid).turn_off();
          }
          if (id(sw_orp_auto).state && !id(sw_electrolyse_mode).state) {
            const bool want_orp = reg_ok && !id(chl_uptime_error) &&
                                  !id(chl_tank_low).state;
            if (want_orp && !id(sw_orp_pid).state) id(sw_orp_pid).turn_on();
            if (!want_orp && id(sw_orp_pid).state) id(sw_orp_pid).turn_off();
          }
          if (winter) {
            if (id(sw_ph_pid).state) id(sw_ph_pid).turn_off();
            if (id(sw_orp_pid).state) id(sw_orp_pid).turn_off();
          }

  # ----------------------------------------------------------------------------
  # Calcul quotidien de la plage de filtration (formule de l'origine) :
  #   T° eau < seuil bas          -> 2 h
  #   seuil bas <= T° < consigne  -> T°/3 h
  #   T° >= consigne              -> T°/2 h
  # Fenêtre centrée sur 15h, bornée par heure-min et heure-max.
  # ----------------------------------------------------------------------------
  - id: compute_filtration_schedule
    then:
      - lambda: |-
          if (!id(water_temp).has_state()) {
            ESP_LOGW("poolmaster", "Calcul filtration: temperature eau inconnue");
            return;
          }
          const float wt = id(water_temp).state;
          int dur;
          if (wt < id(num_water_low).state) dur = 2;
          else if (wt < id(num_water_setpoint).state) dur = (int) roundf(wt / 3.0f);
          else dur = (int) roundf(wt / 2.0f);

          int start = 15 - (int) roundf(dur / 2.0f);
          if (start < (int) id(num_filt_start_min).state)
            start = (int) id(num_filt_start_min).state;
          int stop = start + dur;
          if (stop > (int) id(num_filt_stop_max).state)
            stop = (int) id(num_filt_stop_max).state;

          id(filt_duration_h) = dur;
          id(filt_start_h) = start;
          id(filt_stop_h) = stop;
          ESP_LOGI("poolmaster", "Filtration calculee: %dh (%dh -> %dh, eau %.1f C)",
                   dur, start, stop, wt);
