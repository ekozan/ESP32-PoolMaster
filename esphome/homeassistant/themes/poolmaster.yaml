# ==============================================================================
# PoolMaster — thème Home Assistant
# ==============================================================================
# Thème natif Home Assistant : aucune dépendance HACS. Palette « eau de
# piscine » — bleus profonds, turquoise pour les accents, ambre et rouge
# réservés aux alertes pour qu'elles ressortent vraiment.
#
# Installation :
#   1. Copier ce fichier dans  <config>/themes/poolmaster.yaml
#   2. S'assurer que configuration.yaml contient :
#          frontend:
#            themes: !include_dir_merge_named themes
#   3. Redémarrer Home Assistant.
#   4. L'appliquer : soit globalement (profil utilisateur -> Thème), soit au
#      seul tableau de bord piscine, en ajoutant `theme: PoolMaster` en tête
#      de dashboard.yaml — c'est déjà le cas.
#
# Les deux variantes (claire et sombre) sont définies : Home Assistant bascule
# automatiquement selon le réglage « Auto » du profil.
# ==============================================================================
PoolMaster:
  # ---- Variante claire ------------------------------------------------------
  primary-color: "#0288d1"              # bleu piscine, barre supérieure
  accent-color: "#00bfa5"               # turquoise, éléments actifs
  dark-primary-color: "#01579b"
  light-primary-color: "#b3e5fc"

  primary-background-color: "#eef6fb"   # fond général, très légèrement bleuté
  secondary-background-color: "#dcecf6"
  card-background-color: "#ffffff"
  divider-color: "rgba(2, 136, 209, 0.12)"

  primary-text-color: "#0b2b3c"
  secondary-text-color: "#4a6b7c"
  text-primary-color: "#ffffff"         # texte sur fond coloré
  disabled-text-color: "#9bb3bf"

  # Icônes : gris-bleu au repos, turquoise quand l'entité est active. C'est ce
  # contraste qui rend une pompe en marche repérable d'un coup d'œil.
  state-icon-color: "#5b7b8a"
  state-icon-active-color: "#00bfa5"
  paper-item-icon-color: "#5b7b8a"
  paper-item-icon-active-color: "#00bfa5"

  # Alertes. Volontairement les seules couleurs chaudes du thème : tout ce qui
  # est ambre ou rouge demande une action.
  error-color: "#d32f2f"
  warning-color: "#f57c00"
  success-color: "#2e7d32"
  info-color: "#0288d1"
  state-binary_sensor-active-color: "#d32f2f"   # capteurs `device_class: problem`

  # Cartes : coins francs et ombre douce, pour un rendu moins « plastique »
  # que le défaut.
  ha-card-border-radius: "14px"
  ha-card-box-shadow: "0 2px 6px rgba(2, 43, 60, 0.08)"
  ha-card-border-width: "0"

  # Jauges pH / ORP de la vue d'ensemble.
  gauge-color: "#0288d1"
  gauge-background-color: "#dcecf6"

  # Courbes de l'historique : eau, air, pH, ORP, pression. L'ordre correspond
  # à celui des entités dans les cartes `history-graph`.
  graph-colors: "#0288d1, #00bfa5, #7e57c2, #f57c00, #26a69a, #5c6bc0"
  history-unavailable-color: "rgba(2, 43, 60, 0.06)"

  # ---- Variante sombre ------------------------------------------------------
  modes:
    dark:
      primary-color: "#29b6f6"
      accent-color: "#1de9b6"
      dark-primary-color: "#0277bd"
      light-primary-color: "#0d3446"

      primary-background-color: "#0b1b24"   # bleu nuit, pas noir pur
      secondary-background-color: "#102734"
      card-background-color: "#14313f"
      divider-color: "rgba(41, 182, 246, 0.18)"

      primary-text-color: "#e6f3fa"
      secondary-text-color: "#9fbecd"
      text-primary-color: "#062028"
      disabled-text-color: "#5d7c8c"

      state-icon-color: "#7ea6b8"
      state-icon-active-color: "#1de9b6"
      paper-item-icon-color: "#7ea6b8"
      paper-item-icon-active-color: "#1de9b6"

      error-color: "#ef5350"
      warning-color: "#ffa726"
      success-color: "#66bb6a"
      info-color: "#29b6f6"
      state-binary_sensor-active-color: "#ef5350"

      ha-card-box-shadow: "0 2px 8px rgba(0, 0, 0, 0.35)"

      gauge-color: "#29b6f6"
      gauge-background-color: "#102734"

      graph-colors: "#29b6f6, #1de9b6, #b388ff, #ffa726, #4db6ac, #7986cb"
      history-unavailable-color: "rgba(230, 243, 250, 0.06)"
