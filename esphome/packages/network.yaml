# ==============================================================================
# Réseau : WiFi, API Home Assistant, OTA, serveur web embarqué
# ==============================================================================
# Configuration minimale et raisonnable. Pour une installation réelle (IP fixe,
# authentification du serveur web, puissance d'émission réduite…), voir
# exemple-webui-wifi-ota.yaml qui remplace ce paquet.
# ==============================================================================
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Point d'accès de secours si le WiFi est indisponible
  ap:
    ssid: "PoolMaster Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 3
