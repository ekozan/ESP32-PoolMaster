# ==============================================================================
# Cœur de l'appareil : carte, réseau, API, OTA, journalisation, diagnostics
# ==============================================================================
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Gestion automatique de piscine (portage ESPHome de ESP32-PoolMaster)"
  project:
    name: "ekozan.esp32-poolmaster"
    version: "ESPHome-1.0"

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Point d'accès de secours si le WiFi est indisponible
  ap:
    ssid: "PoolMaster Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: "Redémarrer"
    entity_category: diagnostic
