# ==============================================================================
# Filtration : pompe, plage horaire quotidienne, antigel
# ==============================================================================
# Durée calculée chaque jour à 15h05 selon la température de l'eau
#   T° < seuil bas             -> 2 h
#   seuil bas <= T° < consigne -> T°/3 h
#   T° >= consigne             -> T°/2 h
# La fenêtre est centrée sur 15 h puis bornée par heure-min / heure-max.
# Les seuils de température (num_water_low / num_water_setpoint) sont déclarés
# dans regulation.yaml.
# ==============================================================================
switch:
  - platform: gpio
    web_server:
      sorting_group_id: grp_commandes
      sorting_weight: 10
    pin: ${pin_filtration}
    name: "Pompe filtration"
    id: filtration_pump
    icon: mdi:pump
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: 'id(filt_started_ms) = millis();'

number:
  - platform: template
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 10
    name: "Filtration heure min"
    id: num_filt_start_min
    unit_of_measurement: "h"
    icon: mdi:clock-start
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 20
    name: "Filtration heure max"
    id: num_filt_stop_max
    unit_of_measurement: "h"
    icon: mdi:clock-end
    min_value: 1
    max_value: 24
    step: 1
    initial_value: 22
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

  # --- Encrassement du filtre ------------------------------------------------
  # Règle métier : le filtre est à contre-laver quand la pression en
  # fonctionnement dépasse la pression FILTRE PROPRE de 200 mbar.
  #
  # À ne pas confondre avec « Seuil surpression » (safety.yaml) : celui-là est
  # une sécurité absolue qui coupe la filtration, celui-ci est un indicateur
  # d'entretien qui ne coupe rien.
  - platform: template
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 4
    name: "Filtre propre — pression de référence"
    id: num_psi_clean
    unit_of_measurement: "bar"
    icon: mdi:filter-check
    min_value: 0
    max_value: 3
    step: 0.01
    initial_value: 0.5
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 5
    name: "Seuil d'encrassement"
    id: num_psi_clog
    unit_of_measurement: "mbar"
    icon: mdi:filter-remove
    min_value: 50
    max_value: 1000
    step: 10
    initial_value: 200
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

sensor:
  - platform: template
    web_server:
      sorting_group_id: grp_etat
      sorting_weight: 5
    name: "Encrassement du filtre"
    id: sens_clog
    unit_of_measurement: "mbar"
    icon: mdi:filter
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 60s
    # Écart à la référence filtre propre. Se lit directement contre le seuil :
    # à 200 mbar il est temps de contre-laver. Négatif juste après un
    # contre-lavage si la référence date d'un filtre déjà un peu chargé.
    lambda: |-
      if (!id(psi_running).has_state()) return {};
      return (id(psi_running).state - id(num_psi_clean).state) * 1000.0f;

  - platform: template
    web_server:
      sorting_group_id: grp_etat
      sorting_weight: 10
    name: "Filtration début"
    state_class: measurement
    unit_of_measurement: "h"
    icon: mdi:clock-start
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(filt_start_h);'
  - platform: template
    web_server:
      sorting_group_id: grp_etat
      sorting_weight: 20
    name: "Filtration fin"
    state_class: measurement
    unit_of_measurement: "h"
    icon: mdi:clock-end
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(filt_stop_h);'
  - platform: template
    web_server:
      sorting_group_id: grp_etat
      sorting_weight: 30
    name: "Filtration durée"
    state_class: measurement
    unit_of_measurement: "h"
    icon: mdi:timelapse
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(filt_duration_h);'

binary_sensor:
  - platform: template
    web_server:
      sorting_group_id: grp_etat
      sorting_weight: 4
    name: "Contre-lavage nécessaire"
    id: bs_backwash
    device_class: problem
    icon: mdi:filter-remove
    # L'encrassement est un phénomène lent : on exige 10 min au-dessus du seuil
    # avant d'alerter, ce qui élimine les pointes transitoires au démarrage de
    # la pompe ou lors d'une manœuvre de vanne.
    filters:
      - delayed_on: 10min
      - delayed_off: 10min
    lambda: |-
      if (!id(psi_running).has_state()) return false;
      return (id(psi_running).state - id(num_psi_clean).state) * 1000.0f
             >= id(num_psi_clog).state;

  - platform: template
    web_server:
      sorting_group_id: grp_etat
      sorting_weight: 40
    name: "Antigel actif"
    icon: mdi:snowflake-alert
    lambda: 'return id(antifreeze_on);'

button:
  # À presser juste APRÈS un contre-lavage, filtration relancée : c'est ce qui
  # définit le « zéro » de l'encrassement. Sans ce geste, la référence reste à
  # sa valeur par défaut et l'indicateur ne veut rien dire sur votre
  # installation.
  - platform: template
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 3
    name: "Filtre propre — enregistrer la référence"
    icon: mdi:filter-check
    on_press:
      - lambda: |-
          if (!id(filtration_pump).state ||
              (millis() - id(filt_started_ms)) < 120000) {
            ESP_LOGW("filtre", "Reference: lancez la filtration et attendez "
                               "2 min que le regime s'etablisse");
            return;
          }
          if (!id(psi_val).has_state()) {
            ESP_LOGW("filtre", "Reference: pas de mesure de pression");
            return;
          }
          auto c = id(num_psi_clean).make_call();
          c.set_value(id(psi_val).state);
          c.perform();
          // Ce geste arme aussi la détection de désamorçage (safety.yaml) :
          // tant qu'aucune référence n'a été relevée sur l'installation, son
          // plancher n'a pas de sens et la protection reste inactive.
          id(psi_clean_set) = true;
          ESP_LOGI("filtre", "Reference filtre propre: %.2f bar "
                             "(protection desamorcage armee)",
                   id(psi_val).state);

  - platform: template
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 30
    name: "Recalculer la plage de filtration"
    icon: mdi:calculator
    on_press:
      - script.execute: compute_filtration_schedule

script:
  # ----------------------------------------------------------------------------
  # Tick minute : antigel puis marche/arrêt automatique de la filtration.
  # ----------------------------------------------------------------------------
  - id: filtration_tick
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          if (!t.is_valid()) return;
          const int h = t.hour;

          // --- Antigel : en mode hiver, marche forcée sous -2°C ; on ne
          //     relâche qu'au-dessus de +2°C (hystérésis de l'origine) ---
          if (id(air_temp).has_state()) {
            if (id(sw_winter_mode).state && id(air_temp).state < -2.0f)
              id(antifreeze_on) = true;
            if (id(air_temp).state > 2.0f) id(antifreeze_on) = false;
          }

          // --- Filtration automatique ---
          // Les deux erreurs de pression bloquent tout redémarrage, antigel
          // compris : une pompe désamorcée ne fait circuler aucune eau, elle
          // ne protège donc de rien du gel — elle ne ferait que se détruire à
          // sec. Acquittez l'erreur après avoir réamorcé.
          if (id(psi_error) || id(prime_error)) return;
          const bool in_window = h >= id(filt_start_h) && h < id(filt_stop_h);
          const bool want = (id(sw_auto_mode).state && in_window) || id(antifreeze_on);
          if (!id(sw_auto_mode).state && !id(antifreeze_on)) return;

          if (want && !id(filtration_pump).state) {
            ESP_LOGI("poolmaster", "Filtration: demarrage auto (%dh-%dh)",
                     id(filt_start_h), id(filt_stop_h));
            id(filtration_pump).turn_on();
          }
          // Jamais d'arrêt automatique si l'air est <= 2°C (protection gel)
          const bool freeze_hold = id(air_temp).has_state() &&
                                   id(air_temp).state <= 2.0f;
          if (!want && id(filtration_pump).state && !freeze_hold) {
            ESP_LOGI("poolmaster", "Filtration: arret auto");
            id(filtration_pump).turn_off();
          }

  # ----------------------------------------------------------------------------
  # Calcul quotidien de la plage de filtration (formule de l'origine).
  # ----------------------------------------------------------------------------
  - id: compute_filtration_schedule
    then:
      - lambda: |-
          if (!id(water_temp).has_state()) {
            ESP_LOGW("poolmaster", "Calcul filtration: temperature eau inconnue");
            return;
          }
          const float wt = id(water_temp).state;
          int dur;
          if (wt < id(num_water_low).state) dur = 2;
          else if (wt < id(num_water_setpoint).state) dur = (int) roundf(wt / 3.0f);
          else dur = (int) roundf(wt / 2.0f);

          int start = 15 - (int) roundf(dur / 2.0f);
          if (start < (int) id(num_filt_start_min).state)
            start = (int) id(num_filt_start_min).state;
          int stop = start + dur;
          if (stop > (int) id(num_filt_stop_max).state)
            stop = (int) id(num_filt_stop_max).state;

          id(filt_duration_h) = dur;
          id(filt_start_h) = start;
          id(filt_stop_h) = stop;
          ESP_LOGI("poolmaster", "Filtration calculee: %dh (%dh -> %dh, eau %.1f C)",
                   dur, start, stop, wt);
