# ==============================================================================
# Électrolyseur au sel (SWG)
# ==============================================================================
# Mode régulé par l'ORP : marche si la filtration tourne depuis plus que le
# délai configuré, si l'eau est assez chaude et si l'ORP est sous la consigne.
# Jamais d'électrolyse sans circulation d'eau.
# Lorsque le mode électrolyseur est actif, la pompe doseuse de chlore reste à
# l'arrêt (voir regulation_orp.yaml).
# ==============================================================================
switch:
  - platform: gpio
    pin: ${pin_swg}
    name: "Électrolyseur"
    id: swg_pump
    icon: mdi:water-plus
    restore_mode: ALWAYS_OFF

  - platform: template
    name: "Mode électrolyseur"
    id: sw_electrolyse_mode
    icon: mdi:water-plus
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

number:
  - platform: template
    name: "Électrolyseur température mini"
    id: num_swg_temp
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert
    min_value: 5
    max_value: 25
    step: 0.5
    initial_value: 15
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Électrolyseur délai après filtration"
    id: num_swg_delay
    unit_of_measurement: "min"
    icon: mdi:timer-sand
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 2
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

script:
  # ----------------------------------------------------------------------------
  # Tick 1 s : appelé par scheduler.yaml.
  # ----------------------------------------------------------------------------
  - id: swg_tick
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool filt_on = id(filtration_pump).state;

          if (id(sw_electrolyse_mode).state && id(sw_orp_auto).state) {
            bool want = filt_on && !id(psi_error) &&
                        id(water_temp).has_state() &&
                        id(water_temp).state >= id(num_swg_temp).state &&
                        (now - id(filt_started_ms)) >
                            (uint32_t)(id(num_swg_delay).state * 60000.0f) &&
                        id(orp_val).has_state() &&
                        id(orp_val).state < id(num_orp_setpoint).state;
            if (want && !id(swg_pump).state) id(swg_pump).turn_on();
            if (!want && id(swg_pump).state) id(swg_pump).turn_off();
          } else if (!filt_on && id(swg_pump).state) {
            // Verrouillage : jamais d'électrolyse sans circulation d'eau
            id(swg_pump).turn_off();
          }
