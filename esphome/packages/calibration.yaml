button:
  # --- Assistant pH : deux boutons suffisent ---
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 2
    name: "Étalonnage pH — point suivant"
    icon: mdi:play-circle
    on_press:
      - script.execute: ph_wizard_next
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 6
    name: "Étalonnage pH — annuler"
    icon: mdi:close-circle
    on_press:
      - lambda: |-
          // N'efface que l'assistant : la calibration en vigueur (C0/C1) est
          // conservée tant qu'un nouvel étalonnage n'a pas abouti.
          id(ph_wiz_step) = 0;
          id(cal_ph_n) = 0;
          ESP_LOGI("calib", "Assistant pH annule");

  # --- pH, mode manuel point par point ---
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 20
    name: "pH — enregistrer le point"
    icon: mdi:plus-circle
    on_press:
      - lambda: |-
          if (!id(ph_volts).has_state()) {
            ESP_LOGW("calib", "pH: pas de mesure disponible");
            return;
          }
          if (id(cal_ph_n) >= 8) {
            ESP_LOGW("calib", "pH: 8 points maximum, effacez d'abord");
            return;
          }
          const int i = id(cal_ph_n);
          id(cal_ph_v)[i]   = id(ph_volts).state;
          id(cal_ph_ref)[i] = id(num_cal_ph_ref).state;
          id(cal_ph_n) = i + 1;
          ESP_LOGI("calib", "pH point %d: %.4f V -> %.2f", i + 1,
                   id(cal_ph_v)[i], id(cal_ph_ref)[i]);
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 30
    name: "pH — calculer la calibration"
    icon: mdi:calculator-variant
    on_press:
      - script.execute: cal_compute_ph
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 40
    name: "pH — effacer les points"
    icon: mdi:delete
    on_press:
      - lambda: |-
          id(cal_ph_n) = 0;
          ESP_LOGI("calib", "pH: points de calibration effaces");

  # --- Assistant ORP ---
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 72
    name: "Étalonnage ORP — point suivant"
    icon: mdi:play-circle
    on_press:
      - script.execute: orp_wizard_next
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 76
    name: "Étalonnage ORP — annuler"
    icon: mdi:close-circle
    on_press:
      - lambda: |-
          id(orp_wiz_step) = 0;
          id(cal_orp_n) = 0;
          ESP_LOGI("calib", "Assistant ORP annule");

  # --- ORP, mode manuel point par point ---
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 90
    name: "ORP — enregistrer le point"
    icon: mdi:plus-circle
    on_press:
      - lambda: |-
          if (!id(orp_volts).has_state()) {
            ESP_LOGW("calib", "ORP: pas de mesure disponible");
            return;
          }
          if (id(cal_orp_n) >= 8) {
            ESP_LOGW("calib", "ORP: 8 points maximum, effacez d'abord");
            return;
          }
          const int i = id(cal_orp_n);
          id(cal_orp_v)[i]   = id(orp_volts).state;
          id(cal_orp_ref)[i] = id(num_cal_orp_ref).state;
          id(cal_orp_n) = i + 1;
          ESP_LOGI("calib", "ORP point %d: %.4f V -> %.0f mV", i + 1,
                   id(cal_orp_v)[i], id(cal_orp_ref)[i]);
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 100
    name: "ORP — calculer la calibration"
    icon: mdi:calculator-variant
    on_press:
      - script.execute: cal_compute_orp
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 110
    name: "ORP — effacer les points"
    icon: mdi:delete
    on_press:
      - lambda: |-
          id(cal_orp_n) = 0;
          ESP_LOGI("calib", "ORP: points de calibration effaces");

  # --- Assistant pression ---
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 142
    name: "Étalonnage pression — valider"
    icon: mdi:play-circle
    on_press:
      - script.execute: psi_wizard_next
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 143
    name: "Étalonnage pression — annuler"
    icon: mdi:close-circle
    on_press:
      - lambda: |-
          // On remet la filtration comme on l'a trouvée avant d'abandonner.
          if (id(psi_wiz_step) >= 1 && id(psi_wiz_step) < 9) {
            if (id(psi_wiz_pump_was)) id(filtration_pump).turn_on();
            else                      id(filtration_pump).turn_off();
          }
          id(psi_wiz_step) = 0;
          id(cal_psi_n) = 0;
          ESP_LOGI("calib", "Assistant pression annule, filtration restauree");

  # --- Pression, mode manuel point par point ---
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 160
    name: "Pression — enregistrer le point"
    icon: mdi:plus-circle
    on_press:
      - lambda: |-
          if (!id(psi_volts).has_state()) {
            ESP_LOGW("calib", "PSI: pas de mesure disponible");
            return;
          }
          if (id(cal_psi_n) >= 8) {
            ESP_LOGW("calib", "PSI: 8 points maximum, effacez d'abord");
            return;
          }
          const int i = id(cal_psi_n);
          id(cal_psi_v)[i]   = id(psi_volts).state;
          id(cal_psi_ref)[i] = id(num_cal_psi_ref).state;
          id(cal_psi_n) = i + 1;
          ESP_LOGI("calib", "PSI point %d: %.4f V -> %.2f bar", i + 1,
                   id(cal_psi_v)[i], id(cal_psi_ref)[i]);
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 170
    name: "Pression — calculer la calibration"
    icon: mdi:calculator-variant
    on_press:
      - script.execute: cal_compute_psi
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 180
    name: "Pression — effacer les points"
    icon: mdi:delete
    on_press:
      - lambda: |-
          id(cal_psi_n) = 0;
          ESP_LOGI("calib", "PSI: points de calibration effaces");

script:
  # ----------------------------------------------------------------------------
  # Assistant pH : un seul bouton fait avancer la séquence.
  #   au repos  -> efface les points et passe au tampon 1
  #   tampon N  -> enregistre (tension, pH du tampon N) et passe au suivant
  #   tampon 3  -> enregistre, lance la régression, affiche le résultat
  # Il alimente les mêmes tableaux que le mode manuel et appelle le même
  # cal_compute_ph : un seul moteur de calibration, deux façons de le piloter.
  # ----------------------------------------------------------------------------
  - id: ph_wizard_next
    then:
      - lambda: |-
          const int st = id(ph_wiz_step);

          if (st == 0 || st >= 9) {          // (re)démarrage
            id(cal_ph_n) = 0;
            id(ph_wiz_step) = 1;
            ESP_LOGI("calib", "Assistant pH: demarrage, tampon 1 attendu");
            return;
          }
          if (!id(ph_volts).has_state()) {
            ESP_LOGW("calib", "Assistant pH: pas encore de mesure, patientez");
            return;
          }

          const float ref = st == 1 ? id(num_cal_ph_buf1).state
                          : st == 2 ? id(num_cal_ph_buf2).state
                                    : id(num_cal_ph_buf3).state;
          const int i = id(cal_ph_n);
          id(cal_ph_v)[i]   = id(ph_volts).state;
          id(cal_ph_ref)[i] = ref;
          id(cal_ph_n) = i + 1;
          ESP_LOGI("calib", "Assistant pH: point %d releve, %.4f V -> pH %.2f",
                   st, id(cal_ph_v)[i], ref);

          if (st < 3) {
            id(ph_wiz_step) = st + 1;
          } else {
            id(cal_compute_ph)->execute();   // même régression que le mode manuel
            id(ph_wiz_step) = 9;
          }

  # ----------------------------------------------------------------------------
  # Assistant ORP. Même principe que le pH, mais le nombre de points est
  # configurable et vaut 1 par défaut : voir la note sur la pente matérielle
  # dans la section `number:`.
  # ----------------------------------------------------------------------------
  - id: orp_wizard_next
    then:
      - lambda: |-
          const int st = id(orp_wiz_step);
          const int np = (int) id(num_cal_orp_npts).state;

          if (st == 0 || st >= 9) {
            id(cal_orp_n) = 0;
            id(orp_wiz_step) = 1;
            ESP_LOGI("calib", "Assistant ORP: demarrage, %d point(s)", np);
            return;
          }
          if (!id(orp_volts).has_state()) {
            ESP_LOGW("calib", "Assistant ORP: pas encore de mesure, patientez");
            return;
          }

          const float ref = st == 1 ? id(num_cal_orp_sol1).state
                                    : id(num_cal_orp_sol2).state;
          const int i = id(cal_orp_n);
          id(cal_orp_v)[i]   = id(orp_volts).state;
          id(cal_orp_ref)[i] = ref;
          id(cal_orp_n) = i + 1;
          ESP_LOGI("calib", "Assistant ORP: point %d releve, %.4f V -> %.0f mV",
                   st, id(cal_orp_v)[i], ref);

          if (st < np) {
            id(orp_wiz_step) = st + 1;
          } else {
            id(cal_compute_orp)->execute();
            id(orp_wiz_step) = 9;
          }

  # ----------------------------------------------------------------------------
  # Assistant pression, en 2 points :
  #   point bas  — pompe à l'arrêt : la pression retombe à la pression
  #                atmosphérique, soit 0 bar relatif. Aucune saisie nécessaire,
  #                c'est le zéro physique du capteur.
  #   point haut — pompe en marche : on lit le manomètre du filtre et on saisit
  #                sa valeur. C'est la seule référence disponible ici, il n'y a
  #                pas de « solution étalon » pour une pression.
  #
  # L'assistant arrête puis redémarre la filtration lui-même, et la remet dans
  # l'état où il l'a trouvée à la fin comme à l'annulation.
  # ----------------------------------------------------------------------------
  - id: psi_wizard_next
    then:
      - lambda: |-
          const int st = id(psi_wiz_step);

          if (st == 0 || st >= 9) {
            id(cal_psi_n) = 0;
            id(psi_wiz_pump_was) = id(filtration_pump).state;   // à restaurer
            id(filtration_pump).turn_off();
            id(psi_wiz_step) = 1;
            ESP_LOGI("calib", "Assistant pression: filtration arretee, "
                              "attente du retour a zero");
            return;
          }
          if (!id(psi_volts).has_state()) {
            ESP_LOGW("calib", "Assistant pression: pas encore de mesure");
            return;
          }

          if (st == 1) {
            if (id(filtration_pump).state) {
              ESP_LOGW("calib", "Assistant pression: pompe encore en marche");
              return;
            }
            id(cal_psi_v)[0]   = id(psi_volts).state;
            id(cal_psi_ref)[0] = 0.0f;      // pression atmosphérique
            id(cal_psi_n) = 1;
            ESP_LOGI("calib", "Assistant pression: zero releve a %.4f V",
                     id(cal_psi_v)[0]);
            id(filtration_pump).turn_on();  // enchaîne sur le point haut
            id(psi_wiz_step) = 2;
            return;
          }

          // st == 2 : point haut, lecture du manomètre
          if (!id(filtration_pump).state) {
            ESP_LOGW("calib", "Assistant pression: la pompe s'est arretee, "
                              "annulez et recommencez");
            return;
          }
          const float mano = id(num_cal_psi_ref).state;
          if (mano <= 0.0f) {
            ESP_LOGW("calib", "Assistant pression: saisissez d'abord la lecture "
                              "du manometre (> 0)");
            return;
          }
          id(cal_psi_v)[1]   = id(psi_volts).state;
          id(cal_psi_ref)[1] = mano;
          id(cal_psi_n) = 2;
          ESP_LOGI("calib", "Assistant pression: point haut %.4f V -> %.2f bar",
                   id(cal_psi_v)[1], mano);

          id(cal_compute_psi)->execute();
          if (!id(psi_wiz_pump_was)) id(filtration_pump).turn_off();
          id(psi_wiz_step) = 9;

  # ----------------------------------------------------------------------------
  # Régression linéaire par moindres carrés : ref = C0 * tension + C1
  #
  # On écrit le résultat via make_call() plutôt que publish_state() : c'est le
  # chemin qui déclenche la sauvegarde en NVS des `number` en restore_value,
  # sans quoi la calibration serait perdue au redémarrage.
  # ----------------------------------------------------------------------------
  - id: cal_compute_ph
    then:
      - lambda: |-
          const int n = id(cal_ph_n);
          if (n < 1) { ESP_LOGW("calib", "pH: aucun point enregistre"); return; }

          float c0, c1;
          if (n == 1) {
            // Un seul point : on conserve la pente et on ne recale que l'offset.
            c0 = id(num_ph_c0).state;
            c1 = id(cal_ph_ref)[0] - c0 * id(cal_ph_v)[0];
          } else {
            double sx = 0, sy = 0, sxx = 0, sxy = 0;
            for (int i = 0; i < n; i++) {
              const double x = id(cal_ph_v)[i], y = id(cal_ph_ref)[i];
              sx += x; sy += y; sxx += x * x; sxy += x * y;
            }
            const double den = n * sxx - sx * sx;
            if (fabs(den) < 1e-12) {
              ESP_LOGE("calib", "pH: points trop proches, regression impossible");
              return;
            }
            c0 = (float)((n * sxy - sx * sy) / den);
            c1 = (float)((sy - c0 * sx) / n);
          }

          auto call0 = id(num_ph_c0).make_call(); call0.set_value(c0); call0.perform();
          auto call1 = id(num_ph_c1).make_call(); call1.set_value(c1); call1.perform();
          ESP_LOGI("calib", "pH calibre sur %d point(s): C0=%.6f C1=%.6f", n, c0, c1);

  - id: cal_compute_orp
