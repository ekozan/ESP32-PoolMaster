# ==============================================================================
# Calibration multi-points embarquée (pH, ORP, pression)
# ==============================================================================
# Remplace la saisie manuelle des coefficients C0/C1 par une vraie calibration
# faite depuis Home Assistant, l'interface web ou l'écran Nextion.
#
# Mode d'emploi, pour chaque sonde :
#   1. Plonger la sonde dans une solution étalon (pH 7,01 ; pH 4,01 ; ORP 470 mV…)
#      et attendre que la mesure soit stable.
#   2. Saisir la valeur de l'étalon dans « … référence ».
#   3. Bouton « … enregistrer le point ».
#   4. Recommencer avec un second étalon (et jusqu'à 8 points).
#   5. Bouton « … calculer la calibration » : la régression linéaire est faite
#      à bord et écrit C0/C1.
#
# Nombre de points :
#   1 point   -> seul l'offset est corrigé, la pente est conservée. Utile pour
#                un simple recalage sur tampon pH 7.
#   2 points+ -> régression linéaire par moindres carrés sur tous les points.
#
# Les points sont conservés en NVS : ils survivent aux coupures et aux OTA, on
# peut donc étaler une calibration sur plusieurs jours.
# ==============================================================================
globals:
  # --- Assistant d'étalonnage pH ---
  # 0 = au repos, 1..3 = tampon attendu, 9 = terminé.
  # Volontairement NON persistant : un étalonnage interrompu par une coupure
  # doit repartir de zéro plutôt que de reprendre au milieu avec une sonde
  # qu'on ne sait plus où se trouve.
  - id: ph_wiz_step
    type: int
    initial_value: '0'
  - id: orp_wiz_step
    type: int
    initial_value: '0'
  - id: psi_wiz_step
    type: int
    initial_value: '0'
  # État de la filtration avant l'étalonnage, pour la remettre comme on l'a
  # trouvée : l'assistant arrête puis redémarre la pompe, il ne doit pas
  # laisser l'installation dans un état qu'on n'a pas choisi.
  - id: psi_wiz_pump_was
    type: bool
    initial_value: 'false'

  # --- pH ---
  - id: cal_ph_v            # tensions relevées (V)
    type: float[8]
    restore_value: true
  - id: cal_ph_ref          # valeurs étalon correspondantes
    type: float[8]
    restore_value: true
  - id: cal_ph_n
    type: int
    restore_value: true
    initial_value: '0'
  # --- ORP ---
  - id: cal_orp_v
    type: float[8]
    restore_value: true
  - id: cal_orp_ref
    type: float[8]
    restore_value: true
  - id: cal_orp_n
    type: int
    restore_value: true
    initial_value: '0'
  # --- Pression ---
  - id: cal_psi_v
    type: float[8]
    restore_value: true
  - id: cal_psi_ref
    type: float[8]
    restore_value: true
  - id: cal_psi_n
    type: int
    restore_value: true
    initial_value: '0'

number:
  # --- Les trois tampons de l'assistant, tous paramétrables ---
  # Valeurs par défaut : les tampons du commerce les plus courants.
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 3
    name: "Étalonnage pH — tampon 1"
    id: num_cal_ph_buf1
    icon: mdi:flask
    min_value: 0
    max_value: 14
    step: 0.01
    initial_value: 4.01
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 4
    name: "Étalonnage pH — tampon 2"
    id: num_cal_ph_buf2
    icon: mdi:flask
    min_value: 0
    max_value: 14
    step: 0.01
    initial_value: 7.01
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 5
    name: "Étalonnage pH — tampon 3"
    id: num_cal_ph_buf3
    icon: mdi:flask
    min_value: 0
    max_value: 14
    step: 0.01
    initial_value: 9.18
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 10
    name: "pH référence (solution étalon)"
    id: num_cal_ph_ref
    icon: mdi:test-tube
    min_value: 0
    max_value: 14
    step: 0.01
    initial_value: 7.01
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  # --- Assistant ORP -------------------------------------------------------
  # L'ORP ne se calibre PAS comme le pH. La pente (C0 = 431 mV/V) vient du gain
  # de l'amplificateur de la carte, pas de la sonde : c'est une constante
  # matérielle. Une sonde ORP se recale donc normalement en DÉCALAGE seul, sur
  # une unique solution étalon — d'où « nombre de solutions » à 1 par défaut.
  # Passez à 2 seulement si vous possédez réellement deux solutions ORP
  # distinctes ; forcer une régression sur deux points trop proches dégraderait
  # la pente au lieu de l'améliorer.
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 73
    name: "Étalonnage ORP — nombre de solutions"
    id: num_cal_orp_npts
    icon: mdi:numeric
    min_value: 1
    max_value: 2
    step: 1
    initial_value: 1
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 74
    name: "Étalonnage ORP — solution 1"
    id: num_cal_orp_sol1
    unit_of_measurement: "mV"
    icon: mdi:flask
    min_value: 0
    max_value: 1000
    step: 1
    initial_value: 470
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 75
    name: "Étalonnage ORP — solution 2"
    id: num_cal_orp_sol2
    unit_of_measurement: "mV"
    icon: mdi:flask
    min_value: 0
    max_value: 1000
    step: 1
    initial_value: 240
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 80
    name: "ORP référence (solution étalon)"
    id: num_cal_orp_ref
    unit_of_measurement: "mV"
    icon: mdi:test-tube
    min_value: 0
    max_value: 1000
    step: 1
    initial_value: 470
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 150
    name: "Pression référence (manomètre)"
    id: num_cal_psi_ref
    unit_of_measurement: "bar"
    icon: mdi:test-tube
    min_value: 0
    max_value: 5
    step: 0.01
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

text_sensor:
  # ----------------------------------------------------------------------------
  # Statut de l'assistant : c'est LUI qu'on regarde pendant l'étalonnage. Il dit
  # quoi faire à chaque étape et affiche la tension mesurée en direct, pour voir
  # la sonde se stabiliser avant d'appuyer.
  # ----------------------------------------------------------------------------
  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 1
    name: "Étalonnage pH"
    id: txt_ph_wizard
    icon: mdi:clipboard-text
    update_interval: 2s
    lambda: |-
      char b[220];
      const int st = id(ph_wiz_step);
      const bool hasv = id(ph_volts).has_state();
      const float v = hasv ? id(ph_volts).state : 0.0f;

      if (st == 0) {
        return {"Prêt. Appuyez sur « Démarrer / Point suivant » pour lancer "
                "l'étalonnage 3 points."};
      }
      if (st >= 1 && st <= 3) {
        float ref = st == 1 ? id(num_cal_ph_buf1).state
                  : st == 2 ? id(num_cal_ph_buf2).state
                            : id(num_cal_ph_buf3).state;
        if (hasv)
          snprintf(b, sizeof(b),
                   "%d/3 — Rincez la sonde, plongez-la dans le tampon pH %.2f, "
                   "attendez que la mesure se stabilise (%.4f V), puis appuyez "
                   "sur « Point suivant ».", st, ref, v);
        else
          snprintf(b, sizeof(b), "%d/3 — Tampon pH %.2f. En attente de mesure…",
                   st, ref);
        return {b};
      }
      // Terminé : on rend compte du résultat et de l'état de la sonde. La pente
      // nominale est le C0 d'usine ; s'en écarter beaucoup trahit une sonde
      // fatiguée ou un tampon périmé.
      const float c0 = id(num_ph_c0).state;
      const float nominal = -2.50133333f;
      const int pct = (int) lroundf(100.0f * c0 / nominal);
      const char *verdict = (pct >= 85 && pct <= 115) ? "sonde OK"
                          : (pct >= 70 && pct <= 130) ? "sonde fatiguée"
                                                      : "résultat douteux — à refaire";
      snprintf(b, sizeof(b),
               "Terminé sur %d points. C0=%.5f  C1=%.4f — pente à %d %% du "
               "nominal (%s). Relancez pour recommencer.",
               id(cal_ph_n), c0, id(num_ph_c1).state, pct, verdict);
      return {b};

  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 71
    name: "Étalonnage ORP"
    id: txt_orp_wizard
    icon: mdi:clipboard-text
    update_interval: 2s
    lambda: |-
      char b[220];
      const int st = id(orp_wiz_step);
      const int np = (int) id(num_cal_orp_npts).state;
      const bool hasv = id(orp_volts).has_state();
      const float v = hasv ? id(orp_volts).state : 0.0f;

      if (st == 0) {
        snprintf(b, sizeof(b),
                 "Prêt — étalonnage %d point%s. Appuyez sur « Point suivant » "
                 "pour commencer.", np, np > 1 ? "s" : "");
        return {b};
      }
      if (st >= 1 && st <= 2) {
        const float ref = st == 1 ? id(num_cal_orp_sol1).state
                                  : id(num_cal_orp_sol2).state;
        if (hasv)
          snprintf(b, sizeof(b),
                   "%d/%d — Rincez la sonde, plongez-la dans la solution "
                   "%.0f mV, attendez la stabilisation (%.4f V), puis appuyez "
                   "sur « Point suivant ».", st, np, ref, v);
        else
          snprintf(b, sizeof(b), "%d/%d — Solution %.0f mV. En attente de mesure…",
                   st, np, ref);
        return {b};
      }
      // Terminé. En 1 point on n'a corrigé que le décalage : c'est lui qu'on
      // commente. Un décalage énorme signale une sonde encrassée ou en fin de
      // vie plutôt qu'un simple recalage.
      const float c1 = id(num_orp_c1).state;
      if (id(cal_orp_n) <= 1) {
        const char *verdict = fabsf(c1) < 60.0f  ? "normal"
                            : fabsf(c1) < 150.0f ? "décalage important — nettoyez la sonde"
                                                 : "décalage anormal — sonde probablement HS";
        snprintf(b, sizeof(b),
                 "Terminé sur 1 point (décalage seul). C1=%.1f mV — %s. "
                 "Relancez pour recommencer.", c1, verdict);
      } else {
        const int pct = (int) lroundf(100.0f * id(num_orp_c0).state / 431.03f);
        snprintf(b, sizeof(b),
                 "Terminé sur 2 points. C0=%.2f  C1=%.1f — pente à %d %% du "
                 "gain matériel. Relancez pour recommencer.",
                 id(num_orp_c0).state, c1, pct);
      }
      return {b};

  - platform: template
    web_server:
      sorting_group_id: grp_calibration
      sorting_weight: 141
    name: "Étalonnage pression"
    id: txt_psi_wizard
    icon: mdi:clipboard-text
    update_interval: 2s
    lambda: |-
      char b[240];
      const int st = id(psi_wiz_step);
      const bool hasv = id(psi_volts).has_state();
      const float v = hasv ? id(psi_volts).state : 0.0f;
      const float bar = id(psi_val).has_state() ? id(psi_val).state : 0.0f;

      // La sécurité surpression reste active pendant l'étalonnage — elle
      // s'appuie justement sur le capteur qu'on est en train de calibrer, donc
      // un déclenchement intempestif est possible. On le signale plutôt que de
      // désarmer une protection.
      if (id(psi_error) && st >= 1 && st < 9) {
        return {"⚠ Sécurité surpression déclenchée pendant l'étalonnage. "
                "Acquittez les erreurs, vérifiez le filtre, puis recommencez."};
      }

      if (st == 0) {
        return {"Prêt — étalonnage 2 points : pompe à l'arrêt (zéro), puis en "
                "marche (lecture du manomètre). Appuyez sur « Valider » pour "
                "commencer ; la filtration sera arrêtée."};
      }
      if (st == 1) {
        if (id(filtration_pump).state)
          return {"1/2 — Arrêt de la filtration en cours…"};
        snprintf(b, sizeof(b),
                 "1/2 — Pompe arrêtée. Attendez que la pression retombe à zéro "
                 "(lecture %.4f V), puis appuyez sur « Valider ». La pompe "
                 "démarrera ensuite toute seule.", v);
        return {b};
      }
      if (st == 2) {
        if (!id(filtration_pump).state)
          return {"2/2 — La pompe s'est arrêtée. Annulez et recommencez."};
        snprintf(b, sizeof(b),
                 "2/2 — Pompe en marche (%.4f V, soit %.2f bar avec la "
                 "calibration actuelle). Attendez la stabilisation, lisez le "
                 "manomètre, saisissez sa valeur dans « Pression référence "
                 "(manomètre) », puis appuyez sur « Valider ».", v, bar);
        return {b};
      }
      snprintf(b, sizeof(b),
               "Terminé sur 2 points. C0=%.6f  C1=%.5f — repère haut à "
               "%.2f bar. Relancez pour recommencer.",
               id(num_psi_c0).state, id(num_psi_c1).state,
               id(cal_psi_ref)[1]);
      return {b};

