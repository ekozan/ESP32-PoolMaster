# ==============================================================================
# Régulation ORP — pompe doseuse de chlore, PID fenêtré en sens DIRECT
# ==============================================================================
# Même principe que la régulation pH (fenêtre de 30 min par défaut), mais en
# sens DIRECT : le chlore fait monter l'ORP. La boucle est inactive lorsque le
# mode électrolyseur est choisi (voir electrolyse.yaml).
# ==============================================================================
switch:
  - platform: gpio
    web_server:
      sorting_group_id: grp_commandes
      sorting_weight: 30
    pin: ${pin_chl_pump}
    name: "Pompe Chlore"
    id: chl_pump
    icon: mdi:pump
    restore_mode: ALWAYS_OFF

  - platform: template
    web_server:
      sorting_group_id: grp_regulation
      sorting_weight: 60
    name: "PID ORP"
    id: sw_orp_pid
    icon: mdi:chart-bell-curve
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          id(orp_win_start) = millis();
          id(orp_out_ms) = 0;
          id(orp_integ) = 0;
          id(orp_last_err) = 0;
    on_turn_off:
      - switch.turn_off: chl_pump

number:
  - platform: template
    web_server:
      sorting_group_id: grp_regulation
      sorting_weight: 90
    name: "Consigne ORP"
    id: num_orp_setpoint
    unit_of_measurement: "mV"
    icon: mdi:flash
    min_value: 400
    max_value: 900
    step: 1
    initial_value: 750
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 110
    name: "ORP Kp"
    id: num_orp_kp
    min_value: 0
    max_value: 100000
    step: 100
    initial_value: 2500
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 120
    name: "ORP Ki"
    id: num_orp_ki
    min_value: 0
    max_value: 1000
    step: 0.001
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 130
    name: "ORP Kd"
    id: num_orp_kd
    min_value: 0
    max_value: 1000000000
    step: 1000
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 140
    name: "Fenêtre PID ORP"
    id: num_orp_window
    unit_of_measurement: "min"
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

sensor:
  - platform: template
    web_server:
      sorting_group_id: grp_diagnostic
      sorting_weight: 40
    name: "Marche pompe Chlore aujourd'hui"
    state_class: measurement
    unit_of_measurement: "min"
    icon: mdi:timer
    accuracy_decimals: 1
    update_interval: 30s
    lambda: 'return id(chl_uptime_s) / 60.0f;'

script:
  # ----------------------------------------------------------------------------
  # Tick 1 s : calcul de la dose en début de fenêtre, puis pilotage de la pompe.
  # Appelé par scheduler.yaml après safety_tick.
  # ----------------------------------------------------------------------------
  - id: orp_dosing_tick
    then:
      - lambda: |-
          const uint32_t now = millis();
          // Verrouillages : filtration à l'arrêt, surpression, plafond de temps
          // de marche atteint, ou bac de chlore vide.
          const bool blocked = !id(filtration_pump).state || id(psi_error) ||
                               id(sw_safe_stop).state ||
                               id(chl_uptime_error) || id(chl_tank_low).state;

          if (id(sw_orp_pid).state && !id(sw_electrolyse_mode).state &&
              !blocked && id(orp_val).has_state()) {
            const float win_ms = id(num_orp_window).state * 60000.0f;
            if ((now - id(orp_win_start)) >= (uint32_t) win_ms) {
              id(orp_win_start) = now;
              const float err = id(num_orp_setpoint).state - id(orp_val).state; // DIRECT
              id(orp_integ) += err * win_ms;
              float deriv = (err - id(orp_last_err)) / win_ms;
              id(orp_last_err) = err;
              float out = id(num_orp_kp).state * err
                        + id(num_orp_ki).state * id(orp_integ)
                        + id(num_orp_kd).state * deriv;
              if (out <= 0) { out = 0; id(orp_integ) = 0; }
              if (out > win_ms) { out = win_ms; id(orp_integ) = 0; }
              if (out < 30000) out = 0;
              id(orp_out_ms) = out;
              ESP_LOGI("poolmaster", "PID ORP: mesure=%.0f consigne=%.0f dose=%.0f ms",
                       id(orp_val).state, id(num_orp_setpoint).state, out);
            }
            const bool dose = (now - id(orp_win_start)) < (uint32_t) id(orp_out_ms);
            if (dose && !id(chl_pump).state) id(chl_pump).turn_on();
            if (!dose && id(chl_pump).state) id(chl_pump).turn_off();
          } else if (blocked && id(chl_pump).state) {
            id(chl_pump).turn_off();
          }
