# ==============================================================================
# Régulation pH — pompe doseuse d'acide, PID fenêtré en sens REVERSE
# ==============================================================================
# Principe identique au « PWM lent » de l'origine : au début de chaque fenêtre
# (60 min par défaut) le PID calcule une durée de dosage en ms, la pompe tourne
# pendant cette durée puis s'arrête jusqu'à la fenêtre suivante.
# Kp est donc exprimé en ms de pompe par unité de pH, comme dans le firmware
# d'origine.
# ==============================================================================
switch:
  - platform: gpio
    pin: ${pin_ph_pump}
    name: "Pompe pH"
    id: ph_pump
    icon: mdi:pump
    restore_mode: ALWAYS_OFF

  - platform: template
    name: "PID pH"
    id: sw_ph_pid
    icon: mdi:chart-bell-curve
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          // Nouvelle fenêtre de dosage, erreurs pompes acquittées (comme SetPhPID)
          id(ph_win_start) = millis();
          id(ph_out_ms) = 0;
          id(ph_integ) = 0;
          id(ph_last_err) = 0;
    on_turn_off:
      - switch.turn_off: ph_pump

number:
  - platform: template
    name: "Consigne pH"
    id: num_ph_setpoint
    icon: mdi:ph
    min_value: 6.5
    max_value: 8.5
    step: 0.01
    initial_value: 7.2
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "pH Kp"
    id: num_ph_kp
    min_value: 0
    max_value: 10000000
    step: 10000
    initial_value: 2700000
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "pH Ki"
    id: num_ph_ki
    min_value: 0
    max_value: 1000
    step: 0.001
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "pH Kd"
    id: num_ph_kd
    min_value: 0
    max_value: 1000000000
    step: 1000
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Fenêtre PID pH"
    id: num_ph_window
    unit_of_measurement: "min"
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 60
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

sensor:
  - platform: template
    name: "Marche pompe pH aujourd'hui"
    unit_of_measurement: "min"
    icon: mdi:timer
    accuracy_decimals: 1
    update_interval: 30s
    lambda: 'return id(ph_uptime_s) / 60.0f;'

script:
  # ----------------------------------------------------------------------------
  # Tick 1 s : calcul de la dose en début de fenêtre, puis pilotage de la pompe.
  # Appelé par scheduler.yaml après safety_tick.
  # ----------------------------------------------------------------------------
  - id: ph_dosing_tick
    then:
      - lambda: |-
          const uint32_t now = millis();
          // Verrouillages : filtration à l'arrêt, surpression, plafond de temps
          // de marche atteint, ou bac d'acide vide.
          const bool blocked = !id(filtration_pump).state || id(psi_error) ||
                               id(ph_uptime_error) || id(ph_tank_low).state;

          if (id(sw_ph_pid).state && !blocked && id(ph_val).has_state()) {
            const float win_ms = id(num_ph_window).state * 60000.0f;
            if ((now - id(ph_win_start)) >= (uint32_t) win_ms) {
              id(ph_win_start) = now;
              const float err = id(ph_val).state - id(num_ph_setpoint).state; // REVERSE
              id(ph_integ) += err * win_ms;
              float deriv = (err - id(ph_last_err)) / win_ms;
              id(ph_last_err) = err;
              float out = id(num_ph_kp).state * err
                        + id(num_ph_ki).state * id(ph_integ)
                        + id(num_ph_kd).state * deriv;
              if (out <= 0) { out = 0; id(ph_integ) = 0; }    // anti-windup
              if (out > win_ms) { out = win_ms; id(ph_integ) = 0; }
              if (out < 30000) out = 0;   // dose < 30 s : pas significative
              id(ph_out_ms) = out;
              ESP_LOGI("poolmaster", "PID pH: mesure=%.2f consigne=%.2f dose=%.0f ms",
                       id(ph_val).state, id(num_ph_setpoint).state, out);
            }
            const bool dose = (now - id(ph_win_start)) < (uint32_t) id(ph_out_ms);
            if (dose && !id(ph_pump).state) id(ph_pump).turn_on();
            if (!dose && id(ph_pump).state) id(ph_pump).turn_off();
          } else if (blocked && id(ph_pump).state) {
            id(ph_pump).turn_off();
          }
