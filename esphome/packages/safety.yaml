# ==============================================================================
# Sécurités : surpression, temps de marche quotidien des pompes
# ==============================================================================
# safety_tick est le premier traitement de la boucle 1 s : il arme les drapeaux
# d'erreur et peut couper la filtration, ce que les traitements suivants
# (dosage, électrolyseur, robot) doivent voir dans le même tick.
# Les drapeaux se réarment avec le bouton « Acquitter les erreurs »
# (équivalent de la commande {"Clear":1} de l'origine).
# ==============================================================================
number:
  - platform: template
    web_server:
      sorting_group_id: grp_securite
      sorting_weight: 60
    name: "Seuil surpression"
    id: num_psi_high
    unit_of_measurement: "bar"
    icon: mdi:gauge-full
    min_value: 0.1
    max_value: 5
    step: 0.05
    initial_value: 1.0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_securite
      sorting_weight: 70
    name: "Marche max quotidienne pompes doseuses"
    id: num_max_uptime
    unit_of_measurement: "min"
    icon: mdi:timer-alert
    min_value: 1
    max_value: 240
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

  # --- Détection de désamorçage de la pompe de recirculation ----------------
  # Une pompe désamorcée brasse de l'air : elle ne monte pas en pression et
  # chauffe à vide. Le plancher est la référence « filtre propre » moins cette
  # marge — en dessous, quelque chose ne circule pas.
  #
  # La marge est comptée VERS LE BAS depuis la référence, à l'inverse du seuil
  # d'encrassement qui se compte vers le haut : les deux encadrent la pression
  # normale de l'installation.
  - platform: template
    web_server:
      sorting_group_id: grp_securite
      sorting_weight: 80
    name: "Seuil de désamorçage"
    id: num_psi_prime
    unit_of_measurement: "mbar"
    icon: mdi:water-pump-off
    min_value: 20
    max_value: 1000
    step: 10
    initial_value: 100
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    web_server:
      sorting_group_id: grp_securite
      sorting_weight: 90
    name: "Délai de désamorçage"
    id: num_prime_delay
    unit_of_measurement: "s"
    icon: mdi:timer-sand
    min_value: 10
    max_value: 300
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

switch:
  # ----------------------------------------------------------------------------
  # Arrêt d'urgence : coupe tout ce qui injecte ou consomme, mais laisse l'eau
  # circuler. La filtration n'est délibérément pas touchée — elle continue de
  # suivre son programme, y compris la protection antigel. Garder la
  # recirculation permet d'homogénéiser ce qui a déjà été dosé et de conserver
  # des mesures pH/ORP représentatives pendant l'incident.
  #
  # Sont coupés : pompes pH et Chlore, électrolyseur, robot, pompe de
  # remplissage, et les deux boucles PID pour qu'elles ne relancent rien.
  # Ne sont pas touchés : filtration, relais libres R0/R1, buzzer.
  #
  # L'état est conservé au redémarrage (RESTORE_DEFAULT_OFF) : si vous l'avez
  # armé à cause d'une fuite, un reboot ne doit pas relancer le dosage tout
  # seul. Pensez donc à le désarmer explicitement.
  # ----------------------------------------------------------------------------
  - platform: template
    web_server:
      sorting_group_id: grp_securite
      sorting_weight: 10
    name: "Arrêt d'urgence (hors filtration)"
    id: sw_safe_stop
    icon: mdi:hand-back-right-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      # Effet immédiat, sans attendre le tick suivant. Le maintien dans le
      # temps est assuré par les verrous de chaque fonction, qui testent tous
      # `sw_safe_stop` — couper ici ne suffirait pas, quelque chose pourrait
      # relancer une pompe une seconde plus tard.
      - switch.turn_off: ph_pump
      - switch.turn_off: chl_pump
      - switch.turn_off: swg_pump
      - switch.turn_off: robot_pump
      - switch.turn_off: fill_pump
      - switch.turn_off: sw_ph_pid
      - switch.turn_off: sw_orp_pid
      - logger.log:
          format: "ARRET D'URGENCE arme: dosage, electrolyse, robot et remplissage coupes (filtration conservee)"
          level: WARN
    on_turn_off:
      - logger.log: "Arret d'urgence desarme"

binary_sensor:
  - platform: template
    web_server:
      sorting_group_id: grp_securite
      sorting_weight: 20
    name: "Erreur surpression"
    device_class: problem
    lambda: 'return id(psi_error);'
  - platform: template
    web_server:
      sorting_group_id: grp_securite
      sorting_weight: 30
    name: "Erreur temps de marche pompe pH"
    device_class: problem
    lambda: 'return id(ph_uptime_error);'
  - platform: template
    web_server:
      sorting_group_id: grp_securite
      sorting_weight: 40
    name: "Erreur temps de marche pompe Chlore"
    device_class: problem
    lambda: 'return id(chl_uptime_error);'
  - platform: template
    web_server:
      sorting_group_id: grp_securite
      sorting_weight: 45
    name: "Erreur désamorçage pompe"
    id: bs_prime_error
    icon: mdi:water-pump-off
    device_class: problem
    lambda: 'return id(prime_error);'

button:
  - platform: template
    web_server:
      sorting_group_id: grp_securite
      sorting_weight: 50
    name: "Acquitter les erreurs"
    icon: mdi:alert-circle-check
    on_press:
      - lambda: |-
          id(psi_error) = false;
          id(ph_uptime_error) = false;
          id(chl_uptime_error) = false;
          id(fill_uptime_error) = false;
          id(prime_error) = false;
          id(prime_low_s) = 0;
          ESP_LOGI("poolmaster", "Erreurs acquittées");

script:
  # ----------------------------------------------------------------------------
  # Tick 1 s : premier appel de la boucle de scheduler.yaml.
  # ----------------------------------------------------------------------------
  - id: safety_tick
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool filt_on = id(filtration_pump).state;

          // ------------------------------------------------------------------
          // Sécurité surpression : filtration en marche depuis > 2 min et
          // pression au-dessus du seuil -> erreur, tout s'arrête.
          // ------------------------------------------------------------------
          if (filt_on && (now - id(filt_started_ms)) > 120000 &&
              id(psi_val).has_state() &&
              id(psi_val).state > id(num_psi_high).state) {
            if (!id(psi_error))
              ESP_LOGE("poolmaster", "SURPRESSION: %.2f bar > %.2f bar",
                       id(psi_val).state, id(num_psi_high).state);
            id(psi_error) = true;
          }
          if (id(psi_error) && filt_on) id(filtration_pump).turn_off();

          // ------------------------------------------------------------------
          // Désamorçage : la pompe tourne mais la pression ne monte pas.
          //
          // Le compteur démarre en même temps que la pompe — le délai EST la
          // temporisation de démarrage. Une pompe amorcée monte en pression en
          // quelques secondes, très en deçà des 30 s par défaut ; une pompe qui
          // brasse de l'air n'y arrivera jamais et tourne à sec, ce qui détruit
          // sa garniture mécanique en quelques minutes.
          //
          // Contrairement à la surpression, on ne peut pas attendre 2 min avant
          // de juger : ce sont justement ces 2 min qu'il faut éviter de faire
          // tourner à vide.
          // ------------------------------------------------------------------
          if (!filt_on) {
            id(prime_low_s) = 0;
          } else if (!id(psi_clean_set)) {
            // Protection non armée : sans référence relevée sur l'installation,
            // le plancher vaudrait la valeur d'usine et couperait une pompe
            // parfaitement saine. On le signale une fois par démarrage plutôt
            // que de laisser croire à une protection qui n'existe pas.
            id(prime_low_s) += 1;
            if (id(prime_low_s) == (int) id(num_prime_delay).state)
              ESP_LOGW("poolmaster", "Desamorcage: protection INACTIVE, "
                       "reference filtre propre jamais enregistree");
          } else if (id(psi_val).has_state() &&
                     id(psi_val).state <
                       id(num_psi_clean).state - id(num_psi_prime).state / 1000.0f) {
            id(prime_low_s) += 1;
            if (id(prime_low_s) >= (int) id(num_prime_delay).state &&
                !id(prime_error)) {
              id(prime_error) = true;
              ESP_LOGE("poolmaster", "DESAMORCAGE: %.2f bar sous le plancher "
                       "%.2f bar pendant %d s, filtration coupee",
                       id(psi_val).state,
                       id(num_psi_clean).state - id(num_psi_prime).state / 1000.0f,
                       id(prime_low_s));
            }
          } else {
            id(prime_low_s) = 0;
          }
          if (id(prime_error) && filt_on) id(filtration_pump).turn_off();

          // ------------------------------------------------------------------
          // Comptage temps de marche + consommation bacs + plafond quotidien
          // ------------------------------------------------------------------
          const int max_up_s = (int)(id(num_max_uptime).state * 60);
          if (id(ph_pump).state) {
            id(ph_uptime_s) += 1;
            id(ph_used_l) += id(num_ph_flow).state / 3600.0f;
            if (id(ph_uptime_s) > max_up_s && !id(ph_uptime_error)) {
              id(ph_uptime_error) = true;
              ESP_LOGE("poolmaster", "Pompe pH: temps de marche quotidien depasse");
            }
          }
          if (id(chl_pump).state) {
            id(chl_uptime_s) += 1;
            id(chl_used_l) += id(num_chl_flow).state / 3600.0f;
            if (id(chl_uptime_s) > max_up_s && !id(chl_uptime_error)) {
              id(chl_uptime_error) = true;
              ESP_LOGE("poolmaster", "Pompe Chlore: temps de marche quotidien depasse");
            }
          }
          if (id(sw_safe_stop).state && id(fill_pump).state) id(fill_pump).turn_off();
          if (id(fill_pump).state) {
            id(fill_uptime_s) += 1;
            if (id(fill_uptime_s) > max_up_s && !id(fill_uptime_error)) {
              id(fill_uptime_error) = true;
              ESP_LOGE("poolmaster", "Pompe remplissage: temps de marche quotidien depasse");
              id(fill_pump).turn_off();
            }
          }
