# ==============================================================================
# Sécurités : surpression, temps de marche quotidien des pompes
# ==============================================================================
# safety_tick est le premier traitement de la boucle 1 s : il arme les drapeaux
# d'erreur et peut couper la filtration, ce que les traitements suivants
# (dosage, électrolyseur, robot) doivent voir dans le même tick.
# Les drapeaux se réarment avec le bouton « Acquitter les erreurs »
# (équivalent de la commande {"Clear":1} de l'origine).
# ==============================================================================
number:
  - platform: template
    name: "Seuil surpression"
    id: num_psi_high
    unit_of_measurement: "bar"
    icon: mdi:gauge-full
    min_value: 0.1
    max_value: 5
    step: 0.05
    initial_value: 1.0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    name: "Marche max quotidienne pompes doseuses"
    id: num_max_uptime
    unit_of_measurement: "min"
    icon: mdi:timer-alert
    min_value: 1
    max_value: 240
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

binary_sensor:
  - platform: template
    name: "Erreur surpression"
    device_class: problem
    lambda: 'return id(psi_error);'
  - platform: template
    name: "Erreur temps de marche pompe pH"
    device_class: problem
    lambda: 'return id(ph_uptime_error);'
  - platform: template
    name: "Erreur temps de marche pompe Chlore"
    device_class: problem
    lambda: 'return id(chl_uptime_error);'

button:
  - platform: template
    name: "Acquitter les erreurs"
    icon: mdi:alert-circle-check
    on_press:
      - lambda: |-
          id(psi_error) = false;
          id(ph_uptime_error) = false;
          id(chl_uptime_error) = false;
          id(fill_uptime_error) = false;
          ESP_LOGI("poolmaster", "Erreurs acquittées");

script:
  # ----------------------------------------------------------------------------
  # Tick 1 s : premier appel de la boucle de scheduler.yaml.
  # ----------------------------------------------------------------------------
  - id: safety_tick
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool filt_on = id(filtration_pump).state;

          // ------------------------------------------------------------------
          // Sécurité surpression : filtration en marche depuis > 2 min et
          // pression au-dessus du seuil -> erreur, tout s'arrête.
          // ------------------------------------------------------------------
          if (filt_on && (now - id(filt_started_ms)) > 120000 &&
              id(psi_val).has_state() &&
              id(psi_val).state > id(num_psi_high).state) {
            if (!id(psi_error))
              ESP_LOGE("poolmaster", "SURPRESSION: %.2f bar > %.2f bar",
                       id(psi_val).state, id(num_psi_high).state);
            id(psi_error) = true;
          }
          if (id(psi_error) && filt_on) id(filtration_pump).turn_off();

          // ------------------------------------------------------------------
          // Comptage temps de marche + consommation bacs + plafond quotidien
          // ------------------------------------------------------------------
          const int max_up_s = (int)(id(num_max_uptime).state * 60);
          if (id(ph_pump).state) {
            id(ph_uptime_s) += 1;
            id(ph_used_l) += id(num_ph_flow).state / 3600.0f;
            if (id(ph_uptime_s) > max_up_s && !id(ph_uptime_error)) {
              id(ph_uptime_error) = true;
              ESP_LOGE("poolmaster", "Pompe pH: temps de marche quotidien depasse");
            }
          }
          if (id(chl_pump).state) {
            id(chl_uptime_s) += 1;
            id(chl_used_l) += id(num_chl_flow).state / 3600.0f;
            if (id(chl_uptime_s) > max_up_s && !id(chl_uptime_error)) {
              id(chl_uptime_error) = true;
              ESP_LOGE("poolmaster", "Pompe Chlore: temps de marche quotidien depasse");
            }
          }
          if (id(fill_pump).state) {
            id(fill_uptime_s) += 1;
            if (id(fill_uptime_s) > max_up_s && !id(fill_uptime_error)) {
              id(fill_uptime_error) = true;
              ESP_LOGE("poolmaster", "Pompe remplissage: temps de marche quotidien depasse");
              id(fill_pump).turn_off();
            }
          }
