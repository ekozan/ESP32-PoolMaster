# ==============================================================================
# PoolMaster — Exemple : import des paquets + WiFi, OTA et serveur web réglés
# ==============================================================================
# Fichier d'entrée alternatif à poolmaster.yaml. Il importe toute la logique
# piscine (paquets device + fonctions) mais *remplace* packages/network.yaml
# par une configuration réseau détaillée : WiFi avec IP fixe, mise à jour OTA
# et interface web embarquée avec authentification.
#
#   cp secrets.yaml.example secrets.yaml   # puis remplir
#   esphome run exemple-webui-wifi-ota.yaml
#
# Note : on n'importe PAS packages/network.yaml ici, sinon les deux définitions
# fusionneraient. La fusion de paquets ESPHome est silencieuse pour les
# dictionnaires (wifi:, web_server: — clé par clé, le fichier principal gagne)
# mais elle concatène les listes : deux blocs `ota:` avec des ports différents
# provoquent une erreur « Only a single port is supported ». D'où la séparation
# device.yaml / network.yaml.
# ==============================================================================

substitutions:
  name: poolmaster
  friendly_name: PoolMaster

  # --- Brochage (identique à include/Config.h) ---
  pin_filtration: GPIO32   # Pompe de filtration
  pin_robot: GPIO33        # Pompe robot
  pin_ph_pump: GPIO25      # Pompe péristaltique pH (acide)
  pin_chl_pump: GPIO26     # Pompe péristaltique Chlore
  pin_relay_r0: GPIO27     # Relais libre R0 (projecteur)
  pin_relay_r1: GPIO4      # Relais libre R1
  pin_swg: GPIO13          # Électrolyseur au sel (SWG)
  pin_fill_pump: GPIO23    # Pompe de remplissage
  pin_buzzer: GPIO2        # Buzzer
  pin_chl_level: GPIO39    # Contact niveau bac Chlore (ouvert = niveau bas)
  pin_ph_level: GPIO36     # Contact niveau bac pH (ouvert = niveau bas)
  pin_pool_level: GPIO34   # Contact niveau piscine (ouvert = niveau bas)
  pin_ow_air: GPIO18       # Bus OneWire température air
  pin_ow_water: GPIO19     # Bus OneWire température eau
  pin_sda: GPIO21
  pin_scl: GPIO22
  pin_nextion_tx: GPIO17   # Écran Nextion (Serial2 du firmware d'origine)
  pin_nextion_rx: GPIO16

# ==============================================================================
# Import des paquets
# ==============================================================================
packages:
  device:          !include packages/device.yaml    # carte, logger, diagnostics
  buses:           !include packages/buses.yaml
  state:           !include packages/state.yaml
  scheduler:       !include packages/scheduler.yaml
  measures:        !include packages/measures.yaml
  calibration:     !include packages/calibration.yaml
  modes:           !include packages/modes.yaml
  filtration:      !include packages/filtration.yaml
  regulation:      !include packages/regulation.yaml
  regulation_ph:   !include packages/regulation_ph.yaml
  regulation_orp:  !include packages/regulation_orp.yaml
  electrolyse:     !include packages/electrolyse.yaml
  robot:           !include packages/robot.yaml
  levels:          !include packages/levels.yaml
  safety:          !include packages/safety.yaml
  auxiliary:       !include packages/auxiliary.yaml
  status_leds:     !include packages/status_leds.yaml
  nextion:         !include packages/nextion.yaml
  # network:       volontairement absent — remplacé par les blocs ci-dessous

# --- Variante : import distant depuis GitHub --------------------------------
# Pour consommer les paquets sans cloner le dépôt, voir le fichier prêt à
# l'emploi exemple-import-distant.yaml : même configuration réseau, mais les
# paquets sont récupérés par ESPHome depuis GitHub.

# ==============================================================================
# WiFi
# ==============================================================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # IP fixe : fortement recommandé pour un local technique. L'OTA et l'interface
  # web s'adressent par IP, et une adresse qui change casse les favoris et les
  # scripts de mise à jour.
  manual_ip:
    static_ip: 192.168.1.50
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1

  # Puissance d'émission réduite. Le firmware d'origine descend à 8.5 dBm
  # (WIFI_POWER_8_5dBm, commit 881f9f6) parce que les pics de courant de la
  # radio faisaient décrocher l'alimentation et déclenchaient le brownout.
  # Si votre point d'accès est loin, remontez progressivement (max 20 dB) —
  # mais traitez d'abord la cause : alimentation 5V/2A et câble court.
  output_power: 8.5dB

  # L'économie d'énergie WiFi fait tomber des paquets : l'API Home Assistant se
  # déconnecte et les OTA échouent en cours de transfert. À laisser sur `none`.
  power_save_mode: none

  # Redémarrage si le WiFi est perdu trop longtemps. Attention : la filtration
  # et les régulations tournent en local et survivent à une coupure réseau ;
  # un reboot les remet dans leur `restore_mode` (pompes doseuses à l'arrêt).
  reboot_timeout: 15min

  # Point d'accès de secours, utilisé si le WiFi est indisponible au démarrage.
  ap:
    ssid: "PoolMaster Fallback"
    password: !secret fallback_ap_password

# Portail captif sur le point d'accès de secours : permet de saisir les
# identifiants WiFi depuis un téléphone sans reflasher.
captive_portal:

# ==============================================================================
# API Home Assistant (intégration native, chiffrée)
# ==============================================================================
api:
  encryption:
    key: !secret api_encryption_key
  # Si Home Assistant est injoignable pendant 15 min, on redémarre. Mettre `0s`
  # pour ne jamais redémarrer sur perte d'API (l'automatisation piscine étant
  # entièrement locale, c'est un choix défendable).
  reboot_timeout: 15min

# ==============================================================================
# Mise à jour OTA
# ==============================================================================
# Le premier flash se fait par USB ; ensuite `esphome run` passe en OTA.
# Le port 3232 est celui par défaut : ne le changez que si vous ne réimportez
# jamais packages/network.yaml (voir la note en tête de fichier).
ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - logger.log: "OTA: debut de mise a jour"
    on_error:
      then:
        - logger.log:
            format: "OTA: echec (code %d)"
            args: ['x']
            level: ERROR

# Mode sans échec : après plusieurs redémarrages rapprochés, l'appareil ne
# démarre que le WiFi et l'OTA. Indispensable ici — une configuration qui
# plante en boucle sur du matériel en extérieur redeviendrait autrement
# accessible seulement au tournevis.
safe_mode:
  num_attempts: 5
  reboot_timeout: 5min

# ==============================================================================
# Interface web embarquée
# ==============================================================================
# Accessible sur http://192.168.1.50/ — pratique pour piloter la piscine sans
# passer par Home Assistant (mise en service, vérification des sondes).
web_server:
  port: 80
  version: 3

  # Sans authentification, toute personne sur le réseau peut démarrer les
  # pompes doseuses. À renseigner.
  auth:
    username: !secret web_username
    password: !secret web_password

  # Masque les entités `internal: true` (tensions ADS brutes, buzzer).
  # Passez à `true` pour diagnostiquer une sonde.
  include_internal: false

  # `local: true` embarque le JS dans le firmware au lieu de le charger depuis
  # le CDN oi.esphome.io. À activer si la piscine n'a pas d'accès Internet.
  # Coût mesuré : ~142 Ko en version 3, ~24 Ko en version 2 — soit environ 8 %
  # ou 1,4 % de l'emplacement applicatif de 1,75 Mo. Si la place devient
  # critique, `version: 2` + `local: true` est le compromis le plus économe.
  # local: true
